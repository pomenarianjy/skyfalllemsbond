<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lems Bond Skyfall</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #060911;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Horizontal Widescreen Game Viewport (16:9 Ratio) */
        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 Ratio */
            max-width: 177.78vh; /* 16:9 Aspect Limit */
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Overlays Base Style */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 24px 20px;
            text-align: center;
        }

        /* Start Screen Background */
        #start-screen {
            background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.65)), url('background1.png') center/cover no-repeat;
        }

        /* Translucent Selection Screen to allow underlying Canvas animations */
        #select-screen {
            background: linear-gradient(rgba(15, 23, 42, 0.35), rgba(15, 23, 42, 0.55));
            backdrop-filter: blur(2px);
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.4rem;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255,255,255,0.3);
            margin-top: 5px;
            font-weight: 800;
            position: relative;
            z-index: 2;
        }

        .btn {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            border: none;
            color: white;
            padding: 14px 42px;
            font-size: 1.25rem;
            font-weight: 800;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 126, 95, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Start Screen Image */
        .start-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 92%;
            width: auto;
            max-width: 95%;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.7));
        }

        /* High Score Badge */
        .top-right-score-badge {
            position: absolute;
            top: 18px;
            right: 24px;
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            padding: 8px 20px;
            border-radius: 9999px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 800;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            z-index: 10;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-right-score-badge span {
            color: #22c55e;
            font-size: 1.25rem;
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        /* Selection Cards */
        .selection-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 26px;
            width: 94%;
            max-width: 860px;
            margin: auto 0;
            position: relative;
            z-index: 2;
        }

        .version-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            cursor: pointer;
            box-shadow: 0 16px 36px rgba(0,0,0,0.5), inset 0 0 12px rgba(255,255,255,0.6);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s ease, box-shadow 0.2s ease;
        }

        .version-card:hover {
            transform: translateY(-6px) scale(1.03);
            background: #ffffff;
            box-shadow: 0 22px 42px rgba(0,0,0,0.6), 0 0 20px rgba(255,255,255,0.8);
        }

        .version-card:active {
            transform: scale(0.96);
        }

        .version-card img {
            width: 105px;
            height: 105px;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.25));
            transition: transform 0.2s ease;
        }

        .version-card:hover img {
            transform: scale(1.08);
        }

        .card-text-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .version-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: #0f172a;
            letter-spacing: -0.3px;
        }

        .version-desc {
            font-size: 0.85rem;
            color: #475569;
            font-weight: 700;
        }

        /* Game Over Overlay */
        #gameover-screen {
            padding: 0;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
        }

        .gameover-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 92%;
            width: auto;
            max-width: 95%;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.8));
        }

        .gameover-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 28px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.8) 100%);
        }

        .score-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 18px 42px;
            border-radius: 22px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .score-box:active {
            transform: scale(0.96);
        }

        .score-box h2 {
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 2px;
            font-weight: 800;
        }

        .score-box p {
            font-size: 1rem;
            color: #16a34a;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>Lems Bond Skyfall</h1>
            <img src="birdstart.png" alt="Start Bird" class="start-img" id="img-start-screen" onerror="this.style.display='none'">
            <button class="btn" id="btn-start-proceed">Tap to Play</button>
        </div>

        <!-- Theme Selection Screen -->
        <div id="select-screen" class="overlay hidden">
            <div class="top-right-score-badge">BEST: <span id="txt-select-best">0</span></div>
            <h1>Select Theme</h1>
            <div class="selection-container">
                <div class="version-card" onclick="selectVersion(0)">
                    <img src="bird1.png" alt="Banker" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">The Banker</div>
                        <div class="version-desc">Coins & Wealth</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(1)">
                    <img src="bird2.png" alt="Paris" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">Paris</div>
                        <div class="version-desc">Macarons & Romance</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(2)">
                    <img src="bird3.png" alt="Hong Kong" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">Hong Kong</div>
                        <div class="version-desc">Dragons & Clouds</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="overlay hidden">
            <img src="birdgameover.png" alt="Game Over" class="gameover-bg" id="img-gameover-screen" onerror="this.style.display='none'">
            <div class="gameover-content">
                <div class="score-box">
                    <h2 id="txt-final-score">Score: 0</h2>
                    <p>Tap anywhere to restart</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Horizontal Logical Stage
        const VIEW_W = 800;
        const VIEW_H = 450;

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- WEB AUDIO API SYNTHESIZER ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playFlapSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(360, now);
            osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        }

        function playScoreSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1046.5, now);
            gain1.gain.setValueAtTime(0.2, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1567.98, now + 0.07);
            gain2.gain.setValueAtTime(0.25, now + 0.07);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.07);
            osc2.stop(now + 0.25);
        }

        function playHitSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.18);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.18);
        }

        function playClickSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(1100, now + 0.05);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.05);
        }

        // High Score Memory Manager
        function loadSavedHighScore() {
            try {
                const ls = localStorage.getItem('lemsbond_high_score');
                if (ls !== null) return parseInt(ls, 10) || 0;
            } catch (e) {}
            try {
                const match = document.cookie.match(/(?:^|; )lemsbond_high_score=([^;]*)/);
                if (match) return parseInt(match[1], 10) || 0;
            } catch (e) {}
            return 0;
        }

        function saveHighScore(val) {
            try {
                localStorage.setItem('lemsbond_high_score', val.toString());
            } catch (e) {}
            try {
                const d = new Date();
                d.setTime(d.getTime() + (365 * 24 * 60 * 60 * 1000));
                document.cookie = `lemsbond_high_score=${val};expires=${d.toUTCString()};path=/;SameSite=Lax`;
            } catch (e) {}
        }

        let highScore = loadSavedHighScore();

        function updateHighScoreUI() {
            const selectBestEl = document.getElementById('txt-select-best');
            if (selectBestEl) selectBestEl.innerText = highScore;
        }
        updateHighScoreUI();

        // Assets Loader
        const assets = {
            birds: [new Image(), new Image(), new Image()],
            backgrounds: [new Image(), new Image(), new Image()],
            bottomPipes: [new Image(), new Image(), new Image()],
            topPipes: [new Image(), new Image(), new Image()],
            birdMasks: [null, null, null],
            girls: [new Image(), new Image(), new Image()]
        };

        function generateAlphaMask(img) {
            const tempCanvas = document.createElement('canvas');
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
            tempCtx.drawImage(img, 0, 0);
            try {
                const imgData = tempCtx.getImageData(0, 0, w, h).data;
                const mask = new Uint8Array(w * h);
                for (let i = 0; i < w * h; i++) {
                    mask[i] = imgData[i * 4 + 3] > 50 ? 1 : 0;
                }
                return { mask, width: w, height: h };
            } catch (e) {
                return null;
            }
        }

        function loadBirdAsset(index, src) {
            assets.birds[index].onload = () => {
                assets.birdMasks[index] = generateAlphaMask(assets.birds[index]);
                if (selectedVersion === index) updateBirdBounds();
            };
            assets.birds[index].src = src;
        }

        loadBirdAsset(0, 'bird1.png');
        loadBirdAsset(1, 'bird2.png');
        loadBirdAsset(2, 'bird3.png');

        assets.backgrounds[0].src = 'background1.png';
        assets.backgrounds[1].src = 'background2.png';
        assets.backgrounds[2].src = 'background3.png';

        assets.bottomPipes[0].src = 'coin.png';
        assets.topPipes[0].src = 'coin.png';

        assets.bottomPipes[1].src = 'macaron.png';
        assets.topPipes[1].src = 'macaron.png';

        assets.bottomPipes[2].src = 'dragon.png';
        assets.topPipes[2].src = 'cloud.png';

        // Load 3 Girls
        assets.girls[0].src = 'girl1.png';
        assets.girls[1].src = 'girl2.png';
        assets.girls[2].src = 'girl3.png';

        // Game State
        const STATES = { START: 0, SELECT: 1, PLAYING: 2, GAMEOVER: 3 };
        let currentState = STATES.START;
        let selectedVersion = 0;
        let score = 0;

        // Tuned Physics
        const gravity = 0.26;
        const jumpStrength = -5.6;
        const basePipeWidth = 72;

        let pipeSpeed = 2.2;
        let pipeGap = 175;

        const bird = {
            x: 120,
            y: 180,
            width: 64,
            height: 64,
            velocityY: 0,
            rotation: 0
        };

        const menuBird = {
            x: 100,
            y: 150,
            width: 88,
            height: 88,
            vx: 2.8,
            vy: 1.2,
            angle: 0,
            rotation: 0
        };

        // Particles & Girl Effects State
        let particles = [];
        let girlSparkles = [];
        let orbitAngle = 0;
        let girlAnimTime = 0;

        function spawnSteamParticle(customBird = null) {
            const b = customBird || bird;
            const angle = b.rotation || 0;
            const offsetX = -b.width * 0.22;
            const offsetY = b.height * 0.32;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);

            const px = (b.x + b.width / 2) + (offsetX * cos - offsetY * sin);
            const py = (b.y + b.height / 2) + (offsetX * sin + offsetY * cos);

            const baseVx = customBird ? -customBird.vx * 0.5 : -1.5;

            particles.push({
                type: 'steam',
                x: px,
                y: py,
                vx: baseVx - Math.random() * 1.5,
                vy: 2.8 + Math.random() * 2.2,
                size: customBird ? 6 + Math.random() * 5 : 5 + Math.random() * 4,
                alpha: 0.95,
                life: customBird ? 28 : 22,
                maxLife: customBird ? 28 : 22
            });
        }

        function spawnCandyParticle() {
            const candies = ['🍬', '🍭', '🍫', '🍩', '🧁'];
            const emoji = candies[Math.floor(Math.random() * candies.length)];
            const angle = bird.rotation;
            const offsetX = -bird.width * 0.15;
            const offsetY = bird.height * 0.35;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);

            const px = (bird.x + bird.width / 2) + (offsetX * cos - offsetY * sin);
            const py = (bird.y + bird.height / 2) + (offsetX * sin + offsetY * cos);

            particles.push({
                type: 'candy',
                emoji: emoji,
                x: px,
                y: py,
                vx: (Math.random() - 0.5) * 1.6 - 0.8,
                vy: 2.2 + Math.random() * 2.5,
                size: 16 + Math.random() * 6,
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.18,
                alpha: 1.0,
                life: 32,
                maxLife: 32
            });
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.alpha = Math.max(0, p.life / p.maxLife);

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                if (p.type === 'steam') {
                    p.size += 0.45;
                    ctx.fillStyle = `rgba(240, 248, 255, ${p.alpha * 0.88})`;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'candy') {
                    p.rot += p.vRot;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.globalAlpha = p.alpha;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 10;
                    ctx.font = `${p.size}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.emoji, 0, 0);
                }
                ctx.restore();
            }
        }

        function drawCirclingDragons() {
            orbitAngle += 0.07;
            const cx = bird.x + bird.width / 2;
            const cy = bird.y + bird.height / 2;
            const rx = 48;
            const ry = 28;

            for (let i = 0; i < 2; i++) {
                const angle = orbitAngle + i * Math.PI;
                const dx = cx + Math.cos(angle) * rx;
                const dy = cy + Math.sin(angle) * ry;

                ctx.save();
                ctx.translate(dx, dy);
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 12;
                ctx.font = '22px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🐉', 0, 0);
                ctx.restore();
            }
        }

        function updateBirdBounds() {
            const img = assets.birds[selectedVersion];
            if (img && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0) {
                const maxDim = 68;
                if (img.naturalWidth >= img.naturalHeight) {
                    bird.width = maxDim;
                    bird.height = maxDim * (img.naturalHeight / img.naturalWidth);
                } else {
                    bird.height = maxDim;
                    bird.width = maxDim * (img.naturalWidth / img.naturalHeight);
                }
            }
        }

        // --- GIRLS & SPECIAL EFFECTS RENDERING ---
        function drawGirlAndEffects() {
            girlAnimTime += 0.05;
            const currentGirlImg = assets.girls[selectedVersion];
            
            // Positioning girl at bottom right slightly flying up and down
            const girlW = 100;
            const girlH = 135;
            const baseGirlX = VIEW_W - girlW - 20;
            const floatOffset = Math.sin(girlAnimTime * 1.5) * 10;
            const girlX = baseGirlX;
            const girlY = VIEW_H - girlH - 12 + floatOffset;
            const girlCenterX = girlX + girlW / 2;
            const girlCenterY = girlY + girlH / 2;

            if (selectedVersion === 0) {
                // --- VERSION 1: Girl 1 + White & Pink Flower Petals Circling Body ---
                ctx.save();
                // Draw Petals behind girl body
                const totalPetals = 8;
                for (let i = 0; i < totalPetals; i++) {
                    const angle = girlAnimTime * 1.2 + (i * Math.PI * 2 / totalPetals);
                    const rx = 52;
                    const ry = 36;
                    const px = girlCenterX + Math.cos(angle) * rx;
                    const py = girlCenterY + Math.sin(angle) * ry * 0.7;

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(angle + Math.PI / 4);
                    ctx.fillStyle = i % 2 === 0 ? '#ffb6c1' : '#ffffff';
                    ctx.shadowColor = '#ff69b4';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                ctx.restore();

                // Draw Girl 1 Image
                if (currentGirlImg && currentGirlImg.complete && currentGirlImg.naturalWidth > 0) {
                    ctx.drawImage(currentGirlImg, girlX, girlY, girlW, girlH);
                }

            } else if (selectedVersion === 1) {
                // --- VERSION 2: Girl 2 + Pink Sparkles coming from magic wand/hand to the left ---
                // Draw Girl 2 Image
                if (currentGirlImg && currentGirlImg.complete && currentGirlImg.naturalWidth > 0) {
                    ctx.drawImage(currentGirlImg, girlX, girlY, girlW, girlH);
                }

                // Wand tip location (hand area on left side of girl2)
                const wandX = girlX + 15;
                const wandY = girlY + 38;

                // Magic Light Beams emitting leftward
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 182, 193, 0.45)';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#ff1493';
                ctx.shadowBlur = 10;
                for (let b = 0; b < 3; b++) {
                    const beamAngle = (Math.PI) + (Math.sin(girlAnimTime * 2 + b) * 0.25);
                    const length = 60 + Math.sin(girlAnimTime * 3 + b) * 20;
                    ctx.beginPath();
                    ctx.moveTo(wandX, wandY);
                    ctx.lineTo(wandX + Math.cos(beamAngle) * length, wandY + Math.sin(beamAngle) * length);
                    ctx.stroke();
                }

                // Spawn Sparkles
                if (Math.random() < 0.6) {
                    girlSparkles.push({
                        x: wandX,
                        y: wandY,
                        vx: -2.0 - Math.random() * 2.2,
                        vy: (Math.random() - 0.5) * 1.8,
                        size: 4 + Math.random() * 6,
                        alpha: 1.0,
                        color: Math.random() < 0.5 ? '#ff69b4' : '#ffffff',
                        life: 25
                    });
                }

                // Update & Render Sparkles
                for (let s = girlSparkles.length - 1; s >= 0; s--) {
                    let sp = girlSparkles[s];
                    sp.x += sp.vx;
                    sp.y += sp.vy;
                    sp.life--;
                    sp.alpha = Math.max(0, sp.life / 25);

                    if (sp.life <= 0) {
                        girlSparkles.splice(s, 1);
                        continue;
                    }

                    ctx.fillStyle = sp.color;
                    ctx.shadowColor = '#ff1493';
                    ctx.shadowBlur = 8;
                    ctx.globalAlpha = sp.alpha;
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

            } else if (selectedVersion === 2) {
                // --- VERSION 3: Girl 3 + 3 Red Hearts Circling Above Head ---
                // Draw Girl 3 Image
                if (currentGirlImg && currentGirlImg.complete && currentGirlImg.naturalWidth > 0) {
                    ctx.drawImage(currentGirlImg, girlX, girlY, girlW, girlH);
                }

                // Head area
                const headX = girlCenterX;
                const headY = girlY - 10;

                ctx.save();
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 10;
                ctx.font = '20px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                for (let h = 0; h < 3; h++) {
                    const angle = girlAnimTime * 1.5 + (h * Math.PI * 2 / 3);
                    const hx = headX + Math.cos(angle) * 32;
                    const hy = headY + Math.sin(angle) * 12;

                    ctx.fillText('❤️', hx, hy);
                }
                ctx.restore();
            }
        }

        // Pipes Logic
        let pipes = [];

        function spawnPipes() {
            const minHeight = 50;
            const maxHeight = VIEW_H - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: VIEW_W,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }

        function resetGame() {
            bird.y = 180;
            bird.velocityY = 0;
            bird.rotation = 0;
            score = 0;
            pipes = [];
            particles = [];
            girlSparkles = [];
            pipeSpeed = 2.2;
            pipeGap = 175;
            spawnPipes();
        }

        function selectVersion(v) {
            playClickSound();
            selectedVersion = v;
            updateBirdBounds();
            document.getElementById('select-screen').classList.add('hidden');
            resetGame();
            currentState = STATES.PLAYING;
        }

        function handleJump() {
            if (currentState === STATES.PLAYING) {
                bird.velocityY = jumpStrength;
                playFlapSound();
            }
        }

        // Inputs
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (currentState === STATES.PLAYING) handleJump();
                e.preventDefault();
            }
        });

        container.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button') || e.target.closest('.version-card')) return;

            if (currentState === STATES.START) {
                playClickSound();
                currentState = STATES.SELECT;
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('select-screen').classList.remove('hidden');
            } else if (currentState === STATES.PLAYING) {
                handleJump();
            } else if (currentState === STATES.GAMEOVER) {
                playClickSound();
                document.getElementById('gameover-screen').classList.add('hidden');
                document.getElementById('select-screen').classList.remove('hidden');
                currentState = STATES.SELECT;
            }
        });

        document.getElementById('btn-start-proceed').addEventListener('click', () => {
            playClickSound();
            currentState = STATES.SELECT;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('select-screen').classList.remove('hidden');
        });

        // Pixel-Precise Collision Detection
        function checkPixelCollision(birdX, birdY, birdW, birdH, maskData, pipeX, pipeY, pipeW, pipeH) {
            const ix0 = Math.max(birdX, pipeX);
            const iy0 = Math.max(birdY, pipeY);
            const ix1 = Math.min(birdX + birdW, pipeX + pipeW);
            const iy1 = Math.min(birdY + birdH, pipeY + pipeH);

            if (ix0 >= ix1 || iy0 >= iy1) return false;
            if (!maskData || !maskData.mask) return true;

            const scaleX = maskData.width / birdW;
            const scaleY = maskData.height / birdH;

            for (let y = iy0; y < iy1; y++) {
                for (let x = ix0; x < ix1; x++) {
                    const bx = Math.floor((x - birdX) * scaleX);
                    const by = Math.floor((y - birdY) * scaleY);
                    if (bx >= 0 && bx < maskData.width && by >= 0 && by < maskData.height) {
                        if (maskData.mask[by * maskData.width + bx] === 1) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function checkCollision(p) {
            const birdMask = assets.birdMasks[selectedVersion];
            const topHit = checkPixelCollision(bird.x, bird.y, bird.width, bird.height, birdMask, p.x, 0, basePipeWidth, p.topHeight);
            if (topHit) return true;

            const bottomHit = checkPixelCollision(bird.x, bird.y, bird.width, bird.height, birdMask, p.x, p.bottomY, basePipeWidth, VIEW_H - p.bottomY);
            if (bottomHit) return true;

            return false;
        }

        // Main Game Loop
        let lastTime = performance.now();

        function gameLoop(now) {
            requestAnimationFrame(gameLoop);

            ctx.save();
            const scale = canvas.width / VIEW_W;
            ctx.scale(scale, scale);

            // Draw Background
            const bgImg = assets.backgrounds[selectedVersion];
            if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
                ctx.drawImage(bgImg, 0, 0, VIEW_W, VIEW_H);
            } else {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, VIEW_W, VIEW_H);
            }

            if (currentState === STATES.START || currentState === STATES.SELECT) {
                // Dynamic Menu Bird Animation
                menuBird.x += menuBird.vx;
                menuBird.y += Math.sin(menuBird.angle) * menuBird.vy;
                menuBird.angle += 0.05;

                if (menuBird.x > VIEW_W + 50) {
                    menuBird.x = -menuBird.width;
                    menuBird.y = 80 + Math.random() * 200;
                }

                if (Math.random() < 0.4) spawnSteamParticle(menuBird);
                updateAndDrawParticles();

                const mImg = assets.birds[0];
                if (mImg && mImg.complete) {
                    ctx.drawImage(mImg, menuBird.x, menuBird.y, menuBird.width, menuBird.height);
                }

            } else if (currentState === STATES.PLAYING) {
                // Update Bird Physics
                bird.velocityY += gravity;
                bird.y += bird.velocityY;

                bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.velocityY * 0.08));

                if (selectedVersion === 0) {
                    if (Math.random() < 0.6) spawnSteamParticle();
                } else if (selectedVersion === 1) {
                    if (Math.random() < 0.5) spawnCandyParticle();
                }

                updateAndDrawParticles();

                // Floor / Ceiling Collision
                if (bird.y + bird.height >= VIEW_H || bird.y <= 0) {
                    playHitSound();
                    currentState = STATES.GAMEOVER;
                    document.getElementById('txt-final-score').innerText = `Score: ${score}`;
                    document.getElementById('gameover-screen').classList.remove('hidden');
                }

                // Update & Render Pipes
                for (let i = pipes.length - 1; i >= 0; i--) {
                    let p = pipes[i];
                    p.x -= pipeSpeed;

                    // Draw Top Pipe
                    const topImg = assets.topPipes[selectedVersion];
                    if (topImg && topImg.complete) {
                        ctx.drawImage(topImg, p.x, 0, basePipeWidth, p.topHeight);
                    }

                    // Draw Bottom Pipe
                    const bottomImg = assets.bottomPipes[selectedVersion];
                    if (bottomImg && bottomImg.complete) {
                        ctx.drawImage(bottomImg, p.x, p.bottomY, basePipeWidth, VIEW_H - p.bottomY);
                    }

                    // Collision Check
                    if (checkCollision(p)) {
                        playHitSound();
                        currentState = STATES.GAMEOVER;
                        document.getElementById('txt-final-score').innerText = `Score: ${score}`;
                        document.getElementById('gameover-screen').classList.remove('hidden');
                    }

                    // Score Increment
                    if (!p.passed && p.x + basePipeWidth < bird.x) {
                        p.passed = true;
                        score++;
                        playScoreSound();
                        if (score > highScore) {
                            highScore = score;
                            saveHighScore(highScore);
                            updateHighScoreUI();
                        }
                    }

                    // Remove off-screen pipes
                    if (p.x + basePipeWidth < 0) {
                        pipes.splice(i, 1);
                    }
                }

                // Spawn Pipes
                if (pipes.length === 0 || pipes[pipes.length - 1].x < VIEW_W - 260) {
                    spawnPipes();
                }

                // Draw Bird
                ctx.save();
                ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
                ctx.rotate(bird.rotation);
                const bImg = assets.birds[selectedVersion];
                if (bImg && bImg.complete) {
                    ctx.drawImage(bImg, -bird.width / 2, -bird.height / 2, bird.width, bird.height);
                }
                ctx.restore();

                // Draw Version 3 Dragons
                if (selectedVersion === 2) {
                    drawCirclingDragons();
                }

                // Draw Selected Girl & Special Effects
                drawGirlAndEffects();

                // Draw In-Game Score Text
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.font = '800 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeText(score.toString(), VIEW_W / 2, 50);
                ctx.fillText(score.toString(), VIEW_W / 2, 50);
            }

            ctx.restore();
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>

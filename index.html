<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lems Bond Skyfall</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        /* Full Screen Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: fill;
        }

        /* Full Screen UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            padding: 20px 15px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.2rem;
            color: #f1c40f;
            text-shadow: 2px 2px 6px #000;
            margin-top: 5px;
        }

        .btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            color: white;
            padding: 16px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s, background 0.2s;
            margin-bottom: 10px;
            width: 80%;
            max-width: 320px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Maximized Images preserving proportion */
        .start-img {
            flex: 1;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 70vh;
            object-fit: contain;
            margin: 15px 0;
        }

        .gameover-img {
            flex: 1;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 55vh;
            object-fit: contain;
            margin: 15px 0;
        }

        .score-info {
            margin-bottom: 20px;
        }

        .score-info h2 {
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 8px;
        }

        .score-info p {
            font-size: 1.1rem;
            color: #ddd;
        }

        /* Selection Screen Styles */
        .selection-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 360px;
            margin: 20px 0;
        }

        .version-card {
            background: rgba(255, 255, 255, 0.12);
            border: 3px solid #f1c40f;
            border-radius: 16px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .version-card:active {
            background: rgba(241, 196, 15, 0.35);
            transform: scale(0.97);
        }

        .version-card img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .version-info {
            text-align: right;
        }

        .version-title {
            font-weight: bold;
            font-size: 1.3rem;
            color: #fff;
        }

        .version-desc {
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="360" height="640"></canvas>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h1>Lems Bond Skyfall</h1>
            <img src="birdstart.png" alt="Start Bird" class="start-img" id="img-start-screen" onerror="this.style.display='none'">
            <button class="btn" id="btn-start-proceed">Start Game!</button>
        </div>

        <!-- Selection Screen Overlay -->
        <div id="select-screen" class="overlay hidden">
            <h1>Choose Theme</h1>
            <div class="selection-container">
                <div class="version-card" onclick="selectVersion(1)">
                    <img src="bird1.png" alt="Banker" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\'><circle cx=\'25\' cy=\'25\' r=\'22\' fill=\'gold\'/></svg>'">
                    <div class="version-info">
                        <div class="version-title">The Banker's</div>
                        <div class="version-desc">Coins & Wealth</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(2)">
                    <img src="bird2.png" alt="Paris" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\'><circle cx=\'25\' cy=\'25\' r=\'22\' fill=\'pink\'/></svg>'">
                    <div class="version-info">
                        <div class="version-title">Paris</div>
                        <div class="version-desc">Macarons & Romance</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(3)">
                    <img src="bird3.png" alt="Hong Kong" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\'><circle cx=\'25\' cy=\'25\' r=\'22\' fill=\'red\'/></svg>'">
                    <div class="version-info">
                        <div class="version-title">Hong Kong</div>
                        <div class="version-desc">Dragons & Clouds</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen Overlay -->
        <div id="gameover-screen" class="overlay hidden">
            <img src="birdgameover.png" alt="Game Over" class="gameover-img" id="img-gameover-screen" onerror="this.style.display='none'">
            <div class="score-info">
                <h2 id="txt-final-score">Final Score: 0</h2>
                <p>Tap anywhere to try again</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Assets Loader
        const assets = {
            birds: [new Image(), new Image(), new Image()],
            backgrounds: [new Image(), new Image(), new Image()],
            bottomPipes: [new Image(), new Image(), new Image()],
            topPipes: [new Image(), new Image(), new Image()]
        };

        assets.birds[0].src = 'bird1.png';
        assets.birds[1].src = 'bird2.png';
        assets.birds[2].src = 'bird3.png';

        assets.backgrounds[0].src = 'background1.png';
        assets.backgrounds[1].src = 'background2.png';
        assets.backgrounds[2].src = 'background3.png';

        assets.bottomPipes[0].src = 'coin.png';
        assets.topPipes[0].src = 'coin.png';

        assets.bottomPipes[1].src = 'macaron.png';
        assets.topPipes[1].src = 'macaron.png';

        assets.bottomPipes[2].src = 'dragon.png';
        assets.topPipes[2].src = 'cloud.png';

        // Game Configuration & State Variables
        const STATES = { START: 0, SELECT: 1, PLAYING: 2, GAMEOVER: 3 };
        let currentState = STATES.START;
        let selectedVersion = 0;

        let score = 0;
        let highScore = parseInt(localStorage.getItem('lemsbond_high_score')) || 0;

        // Physics constants
        const gravity = 0.28;
        const jumpStrength = -5.8;
        const basePipeWidth = 62;
        const groundY = 570;

        let pipeSpeed = 2.2;
        let pipeGap = 125;

        // Entities
        const bird = {
            x: 60,
            y: 300,
            width: 42,
            height: 42,
            velocityY: 0
        };

        let pipes = [];
        let spawnTimer = 0;

        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const selectScreen = document.getElementById('select-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const btnStartProceed = document.getElementById('btn-start-proceed');
        const txtFinalScore = document.getElementById('txt-final-score');

        // Handlers
        btnStartProceed.addEventListener('click', (e) => {
            e.stopPropagation();
            startScreen.classList.add('hidden');
            selectScreen.classList.remove('hidden');
            currentState = STATES.SELECT;
        });

        function selectVersion(v) {
            selectedVersion = v - 1;
            selectScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            resetGame();
            currentState = STATES.PLAYING;
        }

        function resetGame() {
            bird.y = 300;
            bird.velocityY = 0;
            pipes = [];
            score = 0;
            pipeSpeed = 2.2;
            pipeGap = 125;
            spawnTimer = 0;
        }

        function handleInput() {
            if (currentState === STATES.PLAYING) {
                bird.velocityY = jumpStrength;
            } else if (currentState === STATES.GAMEOVER) {
                gameoverScreen.classList.add('hidden');
                selectScreen.classList.remove('hidden');
                currentState = STATES.SELECT;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                handleInput();
            }
        });

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        }, { passive: false });

        gameoverScreen.addEventListener('click', handleInput);

        function spawnPipe() {
            const levelMultiplier = Math.floor(score / 10);
            pipeSpeed = 2.2 + (levelMultiplier * 0.4);
            pipeGap = Math.max(85, 125 - (levelMultiplier * 5));

            const minPipeHeight = 50;
            const maxPipeHeight = groundY - pipeGap - minPipeHeight;
            const topHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;

            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }

        function checkCollision(b, pipe) {
            if (b.y <= 0 || b.y + b.height >= groundY) return true;

            const pipeLeft = pipe.x;
            const pipeRight = pipe.x + basePipeWidth;
            const birdRight = b.x + b.width;
            const birdLeft = b.x;

            if (birdRight > pipeLeft && birdLeft < pipeRight) {
                if (b.y < pipe.topHeight || (b.y + b.height) > pipe.bottomY) {
                    return true;
                }
            }
            return false;
        }

        function drawImageOrFallback(img, x, y, w, h, fallbackColor, flipY = false) {
            ctx.save();
            if (flipY) {
                ctx.translate(x + w / 2, y + h / 2);
                ctx.scale(1, -1);
                ctx.translate(-(x + w / 2), -(y + h / 2));
            }

            if (img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, x, y, w, h);
            } else {
                ctx.fillStyle = fallbackColor;
                ctx.fillRect(x, y, w, h);
            }
            ctx.restore();
        }

        function triggerGameOver() {
            currentState = STATES.GAMEOVER;
            txtFinalScore.innerText = `Final Score: ${score}`;
            gameoverScreen.classList.remove('hidden');
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render Background
            if (currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) {
                drawImageOrFallback(assets.backgrounds[selectedVersion], 0, 0, canvas.width, canvas.height, '#70c5ce');
            } else {
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Logic Updates
            if (currentState === STATES.PLAYING) {
                bird.velocityY += gravity;
                bird.y += bird.velocityY;

                spawnTimer++;
                const spawnInterval = Math.max(65, Math.floor(160 / pipeSpeed));
                if (spawnTimer >= spawnInterval) {
                    spawnPipe();
                    spawnTimer = 0;
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    let p = pipes[i];
                    p.x -= pipeSpeed;

                    if (!p.passed && p.x + basePipeWidth < bird.x) {
                        p.passed = true;
                        score++;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('lemsbond_high_score', highScore);
                        }
                    }

                    if (checkCollision(bird, p)) {
                        triggerGameOver();
                    }

                    if (p.x + basePipeWidth < 0) {
                        pipes.splice(i, 1);
                    }
                }

                if (bird.y + bird.height >= groundY) {
                    triggerGameOver();
                }
            }

            // Draw Pipes & Ground
            if (currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) {
                const topImg = assets.topPipes[selectedVersion];
                const botImg = assets.bottomPipes[selectedVersion];

                pipes.forEach(p => {
                    drawImageOrFallback(topImg, p.x, 0, basePipeWidth, p.topHeight, '#2ecc71', true);
                    drawImageOrFallback(botImg, p.x, p.bottomY, basePipeWidth, groundY - p.bottomY, '#2ecc71', false);
                });

                ctx.fillStyle = '#d35400';
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

                drawImageOrFallback(assets.birds[selectedVersion], bird.x, bird.y, bird.width, bird.height, '#f1c40f');
            }

            // Draw In-Game Persistent HUD
            if (currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) {
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 5;
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(`HIGH: ${highScore}`, canvas.width - 15, 30);

                ctx.font = 'bold 28px sans-serif';
                ctx.fillText(`${score}`, canvas.width - 15, 65);
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lems Bond Skyfall</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 50%, #a8e063 80%, #56ab2f 100%);
            color: #1a2a3a;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: fill;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 10;
            padding: 20px 15px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.4rem;
            color: #ffffff;
            text-shadow: 2px 3px 8px rgba(0, 70, 140, 0.6), 0 0 10px rgba(255, 255, 255, 0.8);
            margin-top: 5px;
            font-weight: 800;
        }

        .btn {
            background: linear-gradient(135deg, #ff9f43, #ff5252);
            border: 3px solid #ffffff;
            color: white;
            padding: 16px 36px;
            font-size: 1.4rem;
            font-weight: 800;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: transform 0.1s, background 0.2s;
            margin-bottom: 15px;
            width: 85%;
            max-width: 340px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Start Screen Image - Unrestricted Height/Width to preserve 100% natural proportions */
        .start-img {
            flex: 1;
            width: auto;
            height: auto;
            max-width: 92vw;
            max-height: 65vh;
            object-fit: contain;
            margin: auto;
            filter: drop-shadow(0px 8px 16px rgba(0,60,120,0.25));
        }

        /* Game Over Screen Image */
        .gameover-img {
            flex: 1;
            width: auto;
            height: auto;
            max-width: 88vw;
            max-height: 50vh;
            object-fit: contain;
            margin: auto;
            filter: drop-shadow(0px 6px 12px rgba(0,0,0,0.2));
        }

        .score-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border: 3px solid #2ecc71;
            margin-bottom: 25px;
        }

        .score-box h2 {
            font-size: 2.2rem;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .score-box p {
            font-size: 1.1rem;
            color: #27ae60;
            font-weight: bold;
        }

        /* Horizontal Selection Screen */
        .selection-container {
            flex: 1;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 98vw;
            max-width: 520px;
            margin: 15px 0;
        }

        .version-card {
            flex: 1;
            height: 65vh;
            max-height: 400px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #3498db;
            border-radius: 20px;
            padding: 15px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: background 0.2s, transform 0.15s, border-color 0.2s;
        }

        .version-card:hover, .version-card:active {
            background: #ffffff;
            border-color: #2ecc71;
            transform: translateY(-4px) scale(1.02);
        }

        /* Bird selection options preserving proportion */
        .version-card img {
            width: auto;
            height: auto;
            max-width: 95%;
            max-height: 120px;
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.15));
        }

        .version-info {
            text-align: center;
        }

        .version-title {
            font-weight: 800;
            font-size: 1.15rem;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .version-desc {
            font-size: 0.8rem;
            color: #7f8c8d;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="360" height="640"></canvas>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h1>Lems Bond Skyfall</h1>
            <img src="birdstart.png" alt="Start Bird" class="start-img" id="img-start-screen" onerror="this.style.display='none'">
            <button class="btn" id="btn-start-proceed">Start Game!</button>
        </div>

        <!-- Selection Screen Overlay -->
        <div id="select-screen" class="overlay hidden">
            <h1>Choose Theme</h1>
            <div class="selection-container">
                <div class="version-card" onclick="selectVersion(1)">
                    <img src="bird1.png" alt="Banker" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'80\' height=\'80\'><circle cx=\'40\' cy=\'40\' r=\'35\' fill=\'%23f1c40f\'/></svg>'">
                    <div class="version-info">
                        <div class="version-title">The Banker's</div>
                        <div class="version-desc">Coins & Wealth</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(2)">
                    <img src="bird2.png" alt="Paris" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'80\' height=\'80\'><circle cx=\'40\' cy=\'40\' r=\'35\' fill=\'%23ff7675\'/></svg>'">
                    <div class="version-info">
                        <div class="version-title">Paris</div>
                        <div class="version-desc">Macarons & Romance</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(3)">
                    <img src="bird3.png" alt="Hong Kong" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'80\' height=\'80\'><circle cx=\'40\' cy=\'40\' r=\'35\' fill=\'%23e74c3c\'/></svg>'">
                    <div class="version-info">
                        <div class="version-title">Hong Kong</div>
                        <div class="version-desc">Dragons & Clouds</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen Overlay -->
        <div id="gameover-screen" class="overlay hidden">
            <img src="birdgameover.png" alt="Game Over" class="gameover-img" id="img-gameover-screen" onerror="this.style.display='none'">
            <div class="score-box">
                <h2 id="txt-final-score">Final Score: 0</h2>
                <p>Tap anywhere to try again</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Assets Loader
        const assets = {
            birds: [new Image(), new Image(), new Image()],
            backgrounds: [new Image(), new Image(), new Image()],
            bottomPipes: [new Image(), new Image(), new Image()],
            topPipes: [new Image(), new Image(), new Image()]
        };

        assets.birds[0].src = 'bird1.png';
        assets.birds[1].src = 'bird2.png';
        assets.birds[2].src = 'bird3.png';

        assets.backgrounds[0].src = 'background1.png';
        assets.backgrounds[1].src = 'background2.png';
        assets.backgrounds[2].src = 'background3.png';

        assets.bottomPipes[0].src = 'coin.png';
        assets.topPipes[0].src = 'coin.png';

        assets.bottomPipes[1].src = 'macaron.png';
        assets.topPipes[1].src = 'macaron.png';

        assets.bottomPipes[2].src = 'dragon.png';
        assets.topPipes[2].src = 'cloud.png';

        // State Variables
        const STATES = { START: 0, SELECT: 1, PLAYING: 2, GAMEOVER: 3 };
        let currentState = STATES.START;
        let selectedVersion = 0;

        let score = 0;
        let highScore = parseInt(localStorage.getItem('lemsbond_high_score')) || 0;

        // Physics
        const gravity = 0.28;
        const jumpStrength = -5.8;
        const basePipeWidth = 62;
        const groundY = 570;

        let pipeSpeed = 2.2;
        let pipeGap = 125;

        // Bird entity
        const bird = {
            x: 60,
            y: 300,
            targetWidth: 46,
            width: 46,
            height: 46,
            velocityY: 0
        };

        let pipes = [];
        let spawnTimer = 0;

        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const selectScreen = document.getElementById('select-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const btnStartProceed = document.getElementById('btn-start-proceed');
        const txtFinalScore = document.getElementById('txt-final-score');

        // Handlers
        btnStartProceed.addEventListener('click', (e) => {
            e.stopPropagation();
            startScreen.classList.add('hidden');
            selectScreen.classList.remove('hidden');
            currentState = STATES.SELECT;
        });

        function selectVersion(v) {
            selectedVersion = v - 1;
            selectScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            resetGame();
            currentState = STATES.PLAYING;
        }

        function resetGame() {
            bird.y = 300;
            bird.velocityY = 0;
            pipes = [];
            score = 0;
            pipeSpeed = 2.2;
            pipeGap = 125;
            spawnTimer = 0;
        }

        function handleInput() {
            if (currentState === STATES.PLAYING) {
                bird.velocityY = jumpStrength;
            } else if (currentState === STATES.GAMEOVER) {
                gameoverScreen.classList.add('hidden');
                selectScreen.classList.remove('hidden');
                currentState = STATES.SELECT;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                handleInput();
            }
        });

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        }, { passive: false });

        gameoverScreen.addEventListener('click', handleInput);

        function spawnPipe() {
            const levelMultiplier = Math.floor(score / 10);
            pipeSpeed = 2.2 + (levelMultiplier * 0.4);
            pipeGap = Math.max(85, 125 - (levelMultiplier * 5));

            const minPipeHeight = 50;
            const maxPipeHeight = groundY - pipeGap - minPipeHeight;
            const topHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;

            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }

        function checkCollision(b, pipe) {
            if (b.y <= 0 || b.y + b.height >= groundY) return true;

            const pipeLeft = pipe.x;
            const pipeRight = pipe.x + basePipeWidth;
            const birdRight = b.x + b.width;
            const birdLeft = b.x;

            if (birdRight > pipeLeft && birdLeft < pipeRight) {
                if (b.y < pipe.topHeight || (b.y + b.height) > pipe.bottomY) {
                    return true;
                }
            }
            return false;
        }

        // Draws tiled pipe elements without stretching image aspect ratio
        function drawPipeTiled(img, x, y, width, totalHeight, fallbackColor, flipY = false) {
            if (!img.complete || img.naturalWidth === 0) {
                ctx.fillStyle = fallbackColor;
                ctx.fillRect(x, y, width, totalHeight);
                return;
            }

            const imgAspect = img.naturalHeight / img.naturalWidth;
            const tileHeight = width * imgAspect;

            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, width, totalHeight);
            ctx.clip();

            if (flipY) {
                for (let currY = y + totalHeight - tileHeight; currY >= y - tileHeight; currY -= tileHeight) {
                    ctx.save();
                    ctx.translate(x + width / 2, currY + tileHeight / 2);
                    ctx.scale(1, -1);
                    ctx.drawImage(img, -width / 2, -tileHeight / 2, width, tileHeight);
                    ctx.restore();
                }
            } else {
                for (let currY = y; currY < y + totalHeight; currY += tileHeight) {
                    ctx.drawImage(img, x, currY, width, tileHeight);
                }
            }
            ctx.restore();
        }

        // Renders the bird image preserving its natural aspect ratio
        function drawBirdPreservingAspect(img, b, fallbackColor) {
            if (img.complete && img.naturalWidth > 0 && img.naturalHeight > 0) {
                const aspect = img.naturalHeight / img.naturalWidth;
                b.width = b.targetWidth;
                b.height = b.targetWidth * aspect;
                ctx.drawImage(img, b.x, b.y, b.width, b.height);
            } else {
                b.width = b.targetWidth;
                b.height = b.targetWidth;
                ctx.fillStyle = fallbackColor;
                ctx.fillRect(b.x, b.y, b.width, b.height);
            }
        }

        function triggerGameOver() {
            currentState = STATES.GAMEOVER;
            txtFinalScore.innerText = `Final Score: ${score}`;
            gameoverScreen.classList.remove('hidden');
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render Background
            if (currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) {
                const bgImg = assets.backgrounds[selectedVersion];
                if (bgImg.complete && bgImg.naturalWidth > 0) {
                    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
                } else {
                    let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    skyGrad.addColorStop(0, '#4facfe');
                    skyGrad.addColorStop(0.55, '#00f2fe');
                    skyGrad.addColorStop(0.8, '#a8e063');
                    skyGrad.addColorStop(1, '#56ab2f');
                    ctx.fillStyle = skyGrad;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            } else {
                let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                skyGrad.addColorStop(0, '#4facfe');
                skyGrad.addColorStop(0.55, '#00f2fe');
                skyGrad.addColorStop(0.8, '#a8e063');
                skyGrad.addColorStop(1, '#56ab2f');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Logic Updates
            if (currentState === STATES.PLAYING) {
                bird.velocityY += gravity;
                bird.y += bird.velocityY;

                spawnTimer++;
                const spawnInterval = Math.max(65, Math.floor(160 / pipeSpeed));
                if (spawnTimer >= spawnInterval) {
                    spawnPipe();
                    spawnTimer = 0;
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    let p = pipes[i];
                    p.x -= pipeSpeed;

                    if (!p.passed && p.x + basePipeWidth < bird.x) {
                        p.passed = true;
                        score++;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('lemsbond_high_score', highScore);
                        }
                    }

                    if (checkCollision(bird, p)) {
                        triggerGameOver();
                    }

                    if (p.x + basePipeWidth < 0) {
                        pipes.splice(i, 1);
                    }
                }

                if (bird.y + bird.height >= groundY) {
                    triggerGameOver();
                }
            }

            // Draw Pipes & Ground
            if (currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) {
                const topImg = assets.topPipes[selectedVersion];
                const botImg = assets.bottomPipes[selectedVersion];

                pipes.forEach(p => {
                    // Tiled rendering prevents pipe squishing
                    drawPipeTiled(topImg, p.x, 0, basePipeWidth, p.topHeight, '#2ecc71', true);
                    drawPipeTiled(botImg, p.x, p.bottomY, basePipeWidth, groundY - p.bottomY, '#2ecc71', false);
                });

                ctx.fillStyle = '#27ae60';
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

                // Aspect-ratio safe bird rendering
                drawBirdPreservingAspect(assets.birds[selectedVersion], bird, '#f1c40f');
            }

            // Persistent In-Game HUD
            if (currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) {
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 5;
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(`HIGH: ${highScore}`, canvas.width - 15, 30);

                ctx.font = 'bold 28px sans-serif';
                ctx.fillText(`${score}`, canvas.width - 15, 65);
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

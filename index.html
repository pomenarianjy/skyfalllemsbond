<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lems Bond Skyfall</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #060911;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Horizontal Widescreen Game Viewport (16:9 Ratio) */
        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 Ratio */
            max-width: 177.78vh; /* 16:9 Aspect Limit */
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Overlays Base Style */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 24px 20px;
            text-align: center;
        }

        /* Start and Theme Selection Background */
        #start-screen, #select-screen {
            background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.65)), url('background1.png') center/cover no-repeat;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.8);
            margin-top: 5px;
            font-weight: 800;
            position: relative;
            z-index: 2;
        }

        .btn {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            border: none;
            color: white;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 126, 95, 0.5);
            transition: transform 0.15s ease;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Start Screen Image - Scaled to max screen height without crop/distortion */
        .start-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 92%;
            width: auto;
            max-width: 95%;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.7));
        }

        /* Persistent High Score Pill Top Right on Selection Screen */
        .top-right-score-badge {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 18px;
            border-radius: 9999px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-right-score-badge span {
            color: #22c55e;
            font-size: 1.15rem;
        }

        /* Horizontal Theme Cards */
        .selection-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 90%;
            max-width: 760px;
            margin: auto 0;
            position: relative;
            z-index: 2;
        }

        .version-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .version-card:active {
            transform: scale(0.95);
            background: #ffffff;
        }

        .version-card img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
        }

        .card-text-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .version-title {
            font-weight: 800;
            font-size: 1.05rem;
            color: #0f172a;
        }

        .version-desc {
            font-size: 0.78rem;
            color: #64748b;
            font-weight: 600;
        }

        /* Game Over Overlay */
        #gameover-screen {
            padding: 0;
            justify-content: center;
            background: #000;
        }

        /* Game Over Image - Scaled to max screen height without crop/distortion */
        .gameover-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 92%;
            width: auto;
            max-width: 95%;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.7));
        }

        .gameover-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 25px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.75) 100%);
        }

        .score-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 16px 38px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            cursor: pointer;
        }

        .score-box h2 {
            font-size: 1.8rem;
            color: #0f172a;
            margin-bottom: 2px;
            font-weight: 800;
        }

        .score-box p {
            font-size: 0.95rem;
            color: #16a34a;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>Lems Bond Skyfall</h1>
            <img src="birdstart.png" alt="Start Bird" class="start-img" id="img-start-screen" onerror="this.style.display='none'">
            <button class="btn" id="btn-start-proceed">Tap to Play</button>
        </div>

        <!-- Theme Selection Screen with Best Score Top Right -->
        <div id="select-screen" class="overlay hidden">
            <div class="top-right-score-badge">BEST: <span id="txt-select-best">0</span></div>
            <h1>Select Theme</h1>
            <div class="selection-container">
                <div class="version-card" onclick="selectVersion(1)">
                    <img src="bird1.png" alt="Banker" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">The Banker</div>
                        <div class="version-desc">Coins & Wealth</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(2)">
                    <img src="bird2.png" alt="Paris" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">Paris</div>
                        <div class="version-desc">Macarons & Romance</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(3)">
                    <img src="bird3.png" alt="Hong Kong" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">Hong Kong</div>
                        <div class="version-desc">Dragons & Clouds</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="overlay hidden">
            <img src="birdgameover.png" alt="Game Over" class="gameover-bg" id="img-gameover-screen" onerror="this.style.display='none'">
            <div class="gameover-content">
                <div class="score-box">
                    <h2 id="txt-final-score">Score: 0</h2>
                    <p>Tap anywhere to restart</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Horizontal Logical Stage (800 x 450 = 16:9 ratio)
        const VIEW_W = 800;
        const VIEW_H = 450;

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // High Score Memory Manager (Dual LocalStorage + Cookie Fallback)
        function loadSavedHighScore() {
            try {
                const ls = localStorage.getItem('lemsbond_high_score');
                if (ls !== null) return parseInt(ls, 10) || 0;
            } catch (e) {}

            try {
                const match = document.cookie.match(/(?:^|; )lemsbond_high_score=([^;]*)/);
                if (match) return parseInt(match[1], 10) || 0;
            } catch (e) {}

            return 0;
        }

        function saveHighScore(val) {
            try {
                localStorage.setItem('lemsbond_high_score', val.toString());
            } catch (e) {}

            try {
                const d = new Date();
                d.setTime(d.getTime() + (365 * 24 * 60 * 60 * 1000)); // 1 year cookie
                document.cookie = `lemsbond_high_score=${val};expires=${d.toUTCString()};path=/;SameSite=Lax`;
            } catch (e) {}
        }

        let highScore = loadSavedHighScore();

        function updateHighScoreUI() {
            const selectBestEl = document.getElementById('txt-select-best');
            if (selectBestEl) selectBestEl.innerText = highScore;
        }

        // Initialize display on load
        updateHighScoreUI();

        // Assets Loader
        const assets = {
            birds: [new Image(), new Image(), new Image()],
            backgrounds: [new Image(), new Image(), new Image()],
            bottomPipes: [new Image(), new Image(), new Image()],
            topPipes: [new Image(), new Image(), new Image()],
            birdMasks: [null, null, null]
        };

        // Precise Alpha Masking (Removes invisible PNG border edges)
        function generateAlphaMask(img) {
            const tempCanvas = document.createElement('canvas');
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            tempCanvas.width = w;
            tempCanvas.height = h;

            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
            tempCtx.drawImage(img, 0, 0);

            try {
                const imgData = tempCtx.getImageData(0, 0, w, h).data;
                const mask = new Uint8Array(w * h);

                for (let i = 0; i < w * h; i++) {
                    mask[i] = imgData[i * 4 + 3] > 50 ? 1 : 0;
                }
                return { mask, width: w, height: h };
            } catch (e) {
                return null;
            }
        }

        function loadBirdAsset(index, src) {
            assets.birds[index].onload = () => {
                assets.birdMasks[index] = generateAlphaMask(assets.birds[index]);
                if (selectedVersion === index) updateBirdBounds();
            };
            assets.birds[index].src = src;
        }

        loadBirdAsset(0, 'bird1.png');
        loadBirdAsset(1, 'bird2.png');
        loadBirdAsset(2, 'bird3.png');

        assets.backgrounds[0].src = 'background1.png';
        assets.backgrounds[1].src = 'background2.png';
        assets.backgrounds[2].src = 'background3.png';

        assets.bottomPipes[0].src = 'coin.png';
        assets.topPipes[0].src = 'coin.png';

        assets.bottomPipes[1].src = 'macaron.png';
        assets.topPipes[1].src = 'macaron.png';

        assets.bottomPipes[2].src = 'dragon.png';
        assets.topPipes[2].src = 'cloud.png';

        // Game State
        const STATES = { START: 0, SELECT: 1, PLAYING: 2, GAMEOVER: 3 };
        let currentState = STATES.START;
        let selectedVersion = 0;

        let score = 0;

        // Tuned Physics for Horizontal Layout
        const gravity = 0.26;
        const jumpStrength = -5.6;
        const basePipeWidth = 72;

        let pipeSpeed = 2.2;
        let pipeGap = 175;

        const bird = {
            x: 120,
            y: 180,
            width: 64,
            height: 64,
            velocityY: 0,
            rotation: 0
        };

        // Effects Systems (Particles & Dragon Orbit)
        let particles = [];
        let orbitAngle = 0;

        function spawnSteamParticle() {
            const angle = bird.rotation;
            const offsetX = -bird.width * 0.18;
            const offsetY = bird.height * 0.35;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);

            const px = (bird.x + bird.width / 2) + (offsetX * cos - offsetY * sin);
            const py = (bird.y + bird.height / 2) + (offsetX * sin + offsetY * cos);

            particles.push({
                type: 'steam',
                x: px,
                y: py,
                vx: -1.5 - Math.random() * 1.5,
                vy: 2.8 + Math.random() * 2.2,
                size: 5 + Math.random() * 4,
                alpha: 0.95,
                life: 22,
                maxLife: 22
            });
        }

        function spawnCandyParticle() {
            const candies = ['🍬', '🍭', '🍫', '🍩', '🧁'];
            const emoji = candies[Math.floor(Math.random() * candies.length)];

            const angle = bird.rotation;
            const offsetX = -bird.width * 0.15;
            const offsetY = bird.height * 0.35;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);

            const px = (bird.x + bird.width / 2) + (offsetX * cos - offsetY * sin);
            const py = (bird.y + bird.height / 2) + (offsetX * sin + offsetY * cos);

            particles.push({
                type: 'candy',
                emoji: emoji,
                x: px,
                y: py,
                vx: (Math.random() - 0.5) * 1.6 - 0.8,
                vy: 2.2 + Math.random() * 2.5,
                size: 16 + Math.random() * 6,
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.18,
                alpha: 1.0,
                life: 32,
                maxLife: 32
            });
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.alpha = Math.max(0, p.life / p.maxLife);

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                if (p.type === 'steam') {
                    p.size += 0.45;
                    ctx.fillStyle = `rgba(240, 248, 255, ${p.alpha * 0.85})`;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'candy') {
                    p.rot += p.vRot;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.globalAlpha = p.alpha;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 10;
                    ctx.font = `${p.size}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.emoji, 0, 0);
                }
                ctx.restore();
            }
        }

        function drawCirclingDragons() {
            orbitAngle += 0.07;
            const cx = bird.x + bird.width / 2;
            const cy = bird.y + bird.height / 2;
            const rx = 48;
            const ry = 28;

            for (let i = 0; i < 2; i++) {
                const angle = orbitAngle + i * Math.PI;
                const dx = cx + Math.cos(angle) * rx;
                const dy = cy + Math.sin(angle) * ry;

                ctx.save();
                ctx.translate(dx, dy);
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 12;
                ctx.font = '22px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🐉', 0, 0);
                ctx.restore();
            }
        }

        function updateBirdBounds() {
            const img = assets.birds[selectedVersion];
            if (img && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0) {
                const maxDim = 68;
                if (img.naturalWidth >= img.naturalHeight) {
                    bird.width = maxDim;
                    bird.height = maxDim * (img.naturalHeight / img.naturalWidth);
                } else {
                    bird.height = maxDim;
                    bird.width = maxDim * (img.naturalWidth / img.naturalHeight);
                }
            }
        }

        let pipes = [];
        let spawnTimer = 0;

        // UI Handles
        const startScreen = document.getElementById('start-screen');
        const selectScreen = document.getElementById('select-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const btnStartProceed = document.getElementById('btn-start-proceed');
        const txtFinalScore = document.getElementById('txt-final-score');

        btnStartProceed.addEventListener('click', (e) => {
            e.stopPropagation();
            startScreen.classList.add('hidden');
            selectScreen.classList.remove('hidden');
            updateHighScoreUI();
            currentState = STATES.SELECT;
        });

        function selectVersion(v) {
            selectedVersion = v - 1;
            updateBirdBounds();
            selectScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            resetGame();
            currentState = STATES.PLAYING;
        }

        function resetGame() {
            bird.y = VIEW_H * 0.35;
            bird.velocityY = 0;
            bird.rotation = 0;
            pipes = [];
            particles = [];
            score = 0;
            pipeSpeed = 2.2;
            pipeGap = 175;
            spawnTimer = 0;
            updateBirdBounds();
        }

        function handleInput() {
            if (currentState === STATES.PLAYING) {
                bird.velocityY = jumpStrength;
            } else if (currentState === STATES.GAMEOVER) {
                gameoverScreen.classList.add('hidden');
                selectScreen.classList.remove('hidden');
                updateHighScoreUI();
                currentState = STATES.SELECT;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') handleInput();
        });

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        }, { passive: false });

        gameoverScreen.addEventListener('click', handleInput);

        function spawnPipe() {
            const groundY = VIEW_H - 32;
            const levelMultiplier = Math.floor(score / 8);
            pipeSpeed = 2.2 + (levelMultiplier * 0.25);
            pipeGap = Math.max(140, 175 - (levelMultiplier * 3));

            const minHeight = 50;
            const maxHeight = groundY - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: VIEW_W,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }

        function checkCollision(b, pipe) {
            updateBirdBounds();
            const maskData = assets.birdMasks[selectedVersion];
            const groundY = VIEW_H - 32;

            const pipeLeft = pipe.x;
            const pipeRight = pipe.x + basePipeWidth;
            const topPipeBottom = pipe.topHeight;
            const bottomPipeTop = pipe.bottomY;

            const pad = 2;
            const bLeft = b.x + pad;
            const bRight = b.x + b.width - pad;
            const bTop = b.y + pad;
            const bBottom = b.y + b.height - pad;

            if (bTop <= 0 || bBottom >= groundY) return true;

            if (!maskData) {
                if (bRight > pipeLeft && bLeft < pipeRight) {
                    if (bTop < topPipeBottom || bBottom > bottomPipeTop) return true;
                }
                return false;
            }

            const { mask, width: imgW, height: imgH } = maskData;
            const cx = b.x + b.width / 2;
            const cy = b.y + b.height / 2;
            const cos = Math.cos(b.rotation);
            const sin = Math.sin(b.rotation);

            const step = Math.max(1, Math.floor(imgW / 32));

            for (let py = 0; py < imgH; py += step) {
                for (let px = 0; px < imgW; px += step) {
                    if (mask[py * imgW + px] === 1) {
                        const nx = (px / imgW) - 0.5;
                        const ny = (py / imgH) - 0.5;

                        const localX = nx * b.width;
                        const localY = ny * b.height;

                        const wx = cx + (localX * cos - localY * sin);
                        const wy = cy + (localX * sin + localY * cos);

                        if (wy <= 0 || wy >= groundY) return true;

                        if (wx >= pipeLeft && wx <= pipeRight) {
                            if (wy <= topPipeBottom || wy >= bottomPipeTop) return true;
                        }
                    }
                }
            }
            return false;
        }

        /* Stacked Pipes with Tightened Overlap to remove blank gaps */
        function drawStackedObstacle(img, x, startY, totalHeight, isTopPipe) {
            if (!img.complete || img.naturalWidth === 0) {
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(x, startY, basePipeWidth, totalHeight);
                return;
            }

            const aspect = img.naturalHeight / img.naturalWidth;
            const itemWidth = basePipeWidth;
            const itemHeight = itemWidth * aspect;

            let stepY = itemHeight;
            if (selectedVersion === 0 || selectedVersion === 1) {
                stepY = itemHeight * 0.68; // 32% overlap hides blank space completely
            }

            ctx.save();
            ctx.beginPath();
            ctx.rect(x, startY, basePipeWidth, totalHeight);
            ctx.clip();

            if (isTopPipe) {
                let currY = startY + totalHeight;
                while (currY > startY - itemHeight) {
                    ctx.drawImage(img, x, currY - itemHeight, itemWidth, itemHeight + 1);
                    currY -= stepY;
                }
            } else {
                let currY = startY;
                while (currY < startY + totalHeight) {
                    ctx.drawImage(img, x, currY, itemWidth, itemHeight + 1);
                    currY += stepY;
                }
            }
            ctx.restore();
        }

        /* Draw Bird with Neon White Glow Outline Exuding Out */
        function drawBird(img, b) {
            updateBirdBounds();

            ctx.save();
            ctx.translate(b.x + b.width / 2, b.y + b.height / 2);

            b.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, b.velocityY * 0.08));
            ctx.rotate(b.rotation);

            if (img.complete && img.naturalWidth > 0) {
                // Intense Exuding White Neon Edge Aura
                ctx.save();
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 18;
                ctx.drawImage(img, -b.width / 2, -b.height / 2, b.width, b.height);
                ctx.drawImage(img, -b.width / 2, -b.height / 2, b.width, b.height);
                ctx.restore();

                // Clean Crisp Main Image Layer
                ctx.drawImage(img, -b.width / 2, -b.height / 2, b.width, b.height);
            } else {
                ctx.fillStyle = '#f59e0b';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(0, 0, b.width / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawCleanHUD() {
            const pillW = 110;
            const pillH = 46;
            const pillX = VIEW_W - pillW - 16;
            const pillY = 16;

            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
            ctx.beginPath();
            ctx.roundRect(pillX, pillY, pillW, pillH, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`BEST ${highScore}`, pillX + pillW - 14, pillY + 17);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`${score}`, pillX + pillW - 14, pillY + 38);
            ctx.restore();
        }

        function triggerGameOver() {
            currentState = STATES.GAMEOVER;
            txtFinalScore.innerText = `Score: ${score}`;
            gameoverScreen.classList.remove('hidden');
        }

        function gameLoop() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.scale((rect.width * dpr) / VIEW_W, (rect.height * dpr) / VIEW_H);

            const bgImg = assets.backgrounds[selectedVersion];
            if ((currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) && bgImg.complete && bgImg.naturalWidth > 0) {
                ctx.drawImage(bgImg, 0, 0, VIEW_W, VIEW_H);
            } else {
                let grad = ctx.createLinearGradient(0, 0, 0, VIEW_H);
                grad.addColorStop(0, '#38bdf8');
                grad.addColorStop(0.7, '#818cf8');
                grad.addColorStop(1, '#34d399');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, VIEW_W, VIEW_H);
            }

            if (currentState === STATES.PLAYING) {
                bird.velocityY += gravity;
                bird.y += bird.velocityY;

                // Jetpack / Particle Spawning per Bird Version
                if (selectedVersion === 0) {
                    spawnSteamParticle(); // Bird 1 Steam Jetpack
                } else if (selectedVersion === 1) {
                    if (Math.random() < 0.65) spawnCandyParticle(); // Bird 2 Candy Emojis
                } else if (selectedVersion === 2) {
                    spawnSteamParticle(); // Bird 3 Steam Jetpack
                }

                spawnTimer++;
                const spawnInterval = Math.max(75, Math.floor(170 / pipeSpeed));
                if (spawnTimer >= spawnInterval) {
                    spawnPipe();
                    spawnTimer = 0;
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    let p = pipes[i];
                    p.x -= pipeSpeed;

                    if (!p.passed && p.x + basePipeWidth < bird.x) {
                        p.passed = true;
                        score++;
                        if (score > highScore) {
                            highScore = score;
                            saveHighScore(highScore);
                            updateHighScoreUI();
                        }
                    }

                    if (checkCollision(bird, p)) {
                        triggerGameOver();
                    }

                    if (p.x + basePipeWidth < 0) {
                        pipes.splice(i, 1);
                    }
                }
            }

            if (currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) {
                const topImg = assets.topPipes[selectedVersion];
                const botImg = assets.bottomPipes[selectedVersion];
                const groundY = VIEW_H - 32;

                pipes.forEach(p => {
                    drawStackedObstacle(topImg, p.x, 0, p.topHeight, true);
                    drawStackedObstacle(botImg, p.x, p.bottomY, groundY - p.bottomY, false);
                });

                ctx.fillStyle = 'rgba(15, 23, 42, 0.25)';
                ctx.fillRect(0, groundY, VIEW_W, VIEW_H - groundY);

                // Render Emitters & Particles
                updateAndDrawParticles();

                // Render Bird and Glow
                drawBird(assets.birds[selectedVersion], bird);

                // Bird 3 Orbiting Dragons
                if (selectedVersion === 2) {
                    drawCirclingDragons();
                }

                drawCleanHUD();
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

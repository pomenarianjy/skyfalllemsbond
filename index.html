<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lems Bond Skyfall</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #090d16;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Centered game container with fixed 9:16 ratio */
        #game-container {
            position: relative;
            height: 100vh;
            width: 56.25vh; /* Exactly 9:16 ratio */
            max-width: 100vw;
            max-height: 177.78vw; /* Exactly 16:9 inverse */
            aspect-ratio: 9 / 16;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -webkit-optimize-contrast;
        }

        /* Overlays Base Style */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 24px 16px;
            text-align: center;
        }

        /* Start and Option Pages Background Fix */
        #start-screen, #select-screen {
            background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.65)), url('background1.png') center/cover no-repeat;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
            margin-top: 10px;
            font-weight: 800;
        }

        .btn {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            border: none;
            color: white;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 126, 95, 0.4);
            transition: transform 0.15s ease;
            margin-bottom: 20px;
            width: 80%;
            max-width: 280px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Start Screen Image */
        .start-img {
            max-width: 75%;
            max-height: 45%;
            width: auto;
            height: auto;
            object-fit: contain;
            margin: auto;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
        }

        /* Selection Container and Compact Proportional Cards */
        .selection-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin: auto 0;
        }

        .version-card {
            flex: 1;
            height: auto; /* Dynamic height based on tight content */
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center components tightly */
            gap: 10px; /* Small gap between image and text */
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
            transition: transform 0.15s ease;
        }

        .version-card:active {
            transform: scale(0.95);
            background: #ffffff;
        }

        .version-card img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
        }

        .card-text-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }

        .version-title {
            font-weight: 800;
            font-size: 0.88rem;
            color: #0f172a;
            line-height: 1.1;
        }

        .version-desc {
            font-size: 0.68rem;
            color: #64748b;
            font-weight: 600;
            line-height: 1.1;
        }

        /* Fullscreen Game Over Screen */
        #gameover-screen {
            padding: 0;
            justify-content: center;
            background: #000;
        }

        .gameover-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        .gameover-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 50px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85) 100%);
        }

        .score-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 18px 36px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            cursor: pointer;
        }

        .score-box h2 {
            font-size: 1.8rem;
            color: #0f172a;
            margin-bottom: 2px;
            font-weight: 800;
        }

        .score-box p {
            font-size: 0.95rem;
            color: #16a34a;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen Overlay with background1.png -->
        <div id="start-screen" class="overlay">
            <h1>Lems Bond Skyfall</h1>
            <img src="birdstart.png" alt="Start Bird" class="start-img" id="img-start-screen" onerror="this.style.display='none'">
            <button class="btn" id="btn-start-proceed">Tap to Play</button>
        </div>

        <!-- Selection Screen Overlay with background1.png -->
        <div id="select-screen" class="overlay hidden">
            <h1>Select Theme</h1>
            <div class="selection-container">
                <div class="version-card" onclick="selectVersion(1)">
                    <img src="bird1.png" alt="Banker" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">The Banker</div>
                        <div class="version-desc">Coins & Wealth</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(2)">
                    <img src="bird2.png" alt="Paris" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">Paris</div>
                        <div class="version-desc">Macarons & Romance</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(3)">
                    <img src="bird3.png" alt="Hong Kong" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">Hong Kong</div>
                        <div class="version-desc">Dragons & Clouds</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="overlay hidden">
            <img src="birdgameover.png" alt="Game Over" class="gameover-bg" id="img-gameover-screen" onerror="this.style.display='none'">
            <div class="gameover-content">
                <div class="score-box">
                    <h2 id="txt-final-score">Score: 0</h2>
                    <p>Tap anywhere to restart</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Internal Logical Canvas Stage (360 x 640 = 9:16 ratio)
        const VIEW_W = 360;
        const VIEW_H = 640;

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Assets Loader
        const assets = {
            birds: [new Image(), new Image(), new Image()],
            backgrounds: [new Image(), new Image(), new Image()],
            bottomPipes: [new Image(), new Image(), new Image()],
            topPipes: [new Image(), new Image(), new Image()],
            birdMasks: [null, null, null]
        };

        function generateAlphaMask(img) {
            const tempCanvas = document.createElement('canvas');
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            tempCanvas.width = w;
            tempCanvas.height = h;

            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
            tempCtx.drawImage(img, 0, 0);

            try {
                const imgData = tempCtx.getImageData(0, 0, w, h).data;
                const mask = new Uint8Array(w * h);

                for (let i = 0; i < w * h; i++) {
                    mask[i] = imgData[i * 4 + 3] > 30 ? 1 : 0;
                }
                return { mask, width: w, height: h };
            } catch (e) {
                return null;
            }
        }

        function loadBirdAsset(index, src) {
            assets.birds[index].onload = () => {
                assets.birdMasks[index] = generateAlphaMask(assets.birds[index]);
                if (selectedVersion === index) updateBirdBounds();
            };
            assets.birds[index].src = src;
        }

        loadBirdAsset(0, 'bird1.png');
        loadBirdAsset(1, 'bird2.png');
        loadBirdAsset(2, 'bird3.png');

        assets.backgrounds[0].src = 'background1.png';
        assets.backgrounds[1].src = 'background2.png';
        assets.backgrounds[2].src = 'background3.png';

        assets.bottomPipes[0].src = 'coin.png';
        assets.topPipes[0].src = 'coin.png';

        assets.bottomPipes[1].src = 'macaron.png';
        assets.topPipes[1].src = 'macaron.png';

        assets.bottomPipes[2].src = 'dragon.png';
        assets.topPipes[2].src = 'cloud.png';

        // Game State
        const STATES = { START: 0, SELECT: 1, PLAYING: 2, GAMEOVER: 3 };
        let currentState = STATES.START;
        let selectedVersion = 0;

        let score = 0;
        let highScore = parseInt(localStorage.getItem('lemsbond_high_score')) || 0;

        // Physics
        const gravity = 0.32;
        const jumpStrength = -6.2;
        const basePipeWidth = 60;

        let pipeSpeed = 2.4;
        let pipeGap = 140;

        const bird = {
            x: 65,
            y: 260,
            width: 44,
            height: 44,
            velocityY: 0,
            rotation: 0
        };

        function updateBirdBounds() {
            const img = assets.birds[selectedVersion];
            if (img && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0) {
                const maxDim = 44;
                if (img.naturalWidth >= img.naturalHeight) {
                    bird.width = maxDim;
                    bird.height = maxDim * (img.naturalHeight / img.naturalWidth);
                } else {
                    bird.height = maxDim;
                    bird.width = maxDim * (img.naturalWidth / img.naturalHeight);
                }
            }
        }

        let pipes = [];
        let spawnTimer = 0;

        // UI Handles
        const startScreen = document.getElementById('start-screen');
        const selectScreen = document.getElementById('select-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const btnStartProceed = document.getElementById('btn-start-proceed');
        const txtFinalScore = document.getElementById('txt-final-score');

        btnStartProceed.addEventListener('click', (e) => {
            e.stopPropagation();
            startScreen.classList.add('hidden');
            selectScreen.classList.remove('hidden');
            currentState = STATES.SELECT;
        });

        function selectVersion(v) {
            selectedVersion = v - 1;
            updateBirdBounds();
            selectScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            resetGame();
            currentState = STATES.PLAYING;
        }

        function resetGame() {
            bird.y = VIEW_H * 0.4;
            bird.velocityY = 0;
            bird.rotation = 0;
            pipes = [];
            score = 0;
            pipeSpeed = 2.4;
            pipeGap = 140;
            spawnTimer = 0;
            updateBirdBounds();
        }

        function handleInput() {
            if (currentState === STATES.PLAYING) {
                bird.velocityY = jumpStrength;
            } else if (currentState === STATES.GAMEOVER) {
                gameoverScreen.classList.add('hidden');
                selectScreen.classList.remove('hidden');
                currentState = STATES.SELECT;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') handleInput();
        });

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        }, { passive: false });

        gameoverScreen.addEventListener('click', handleInput);

        function spawnPipe() {
            const groundY = VIEW_H - 36;
            const levelMultiplier = Math.floor(score / 10);
            pipeSpeed = 2.4 + (levelMultiplier * 0.35);
            pipeGap = Math.max(110, 140 - (levelMultiplier * 4));

            const minHeight = 60;
            const maxHeight = groundY - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: VIEW_W,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }

        function checkCollision(b, pipe) {
            updateBirdBounds();
            const maskData = assets.birdMasks[selectedVersion];
            const groundY = VIEW_H - 36;

            const pipeLeft = pipe.x;
            const pipeRight = pipe.x + basePipeWidth;
            const topPipeBottom = pipe.topHeight;
            const bottomPipeTop = pipe.bottomY;

            if (!maskData) {
                if (b.y <= 0 || (b.y + b.height) >= groundY) return true;
                if ((b.x + b.width) > pipeLeft && b.x < pipeRight) {
                    if (b.y < topPipeBottom || (b.y + b.height) > bottomPipeTop) return true;
                }
                return false;
            }

            const { mask, width: imgW, height: imgH } = maskData;
            const cx = b.x + b.width / 2;
            const cy = b.y + b.height / 2;
            const cos = Math.cos(b.rotation);
            const sin = Math.sin(b.rotation);

            const step = Math.max(1, Math.floor(imgW / 24));

            for (let py = 0; py < imgH; py += step) {
                for (let px = 0; px < imgW; px += step) {
                    if (mask[py * imgW + px] === 1) {
                        const nx = (px / imgW) - 0.5;
                        const ny = (py / imgH) - 0.5;

                        const localX = nx * b.width;
                        const localY = ny * b.height;

                        const wx = cx + (localX * cos - localY * sin);
                        const wy = cy + (localX * sin + localY * cos);

                        if (wy <= 0 || wy >= groundY) return true;

                        if (wx >= pipeLeft && wx <= pipeRight) {
                            if (wy <= topPipeBottom || wy >= bottomPipeTop) return true;
                        }
                    }
                }
            }
            return false;
        }

        function drawStackedObstacle(img, x, startY, totalHeight, isTopPipe) {
            if (!img.complete || img.naturalWidth === 0) {
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(x, startY, basePipeWidth, totalHeight);
                return;
            }

            const aspect = img.naturalHeight / img.naturalWidth;
            const itemWidth = basePipeWidth;
            const itemHeight = itemWidth * aspect;
            const count = Math.max(1, Math.ceil(totalHeight / itemHeight));

            ctx.save();
            ctx.beginPath();
            ctx.rect(x, startY, basePipeWidth, totalHeight);
            ctx.clip();

            if (isTopPipe) {
                for (let i = 0; i < count; i++) {
                    const itemY = (startY + totalHeight) - ((i + 1) * itemHeight);
                    ctx.drawImage(img, x, itemY, itemWidth, itemHeight);
                }
            } else {
                for (let i = 0; i < count; i++) {
                    const itemY = startY + (i * itemHeight);
                    ctx.drawImage(img, x, itemY, itemWidth, itemHeight);
                }
            }
            ctx.restore();
        }

        function drawBird(img, b) {
            updateBirdBounds();

            ctx.save();
            ctx.translate(b.x + b.width / 2, b.y + b.height / 2);

            b.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, b.velocityY * 0.08));
            ctx.rotate(b.rotation);

            if (img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, -b.width / 2, -b.height / 2, b.width, b.height);
            } else {
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(0, 0, b.width / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawCleanHUD() {
            const pillW = 100;
            const pillH = 46;
            const pillX = VIEW_W - pillW - 14;
            const pillY = 14;

            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
            ctx.beginPath();
            ctx.roundRect(pillX, pillY, pillW, pillH, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.font = '600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`BEST ${highScore}`, pillX + pillW - 12, pillY + 16);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`${score}`, pillX + pillW - 12, pillY + 36);
            ctx.restore();
        }

        function triggerGameOver() {
            currentState = STATES.GAMEOVER;
            txtFinalScore.innerText = `Score: ${score}`;
            gameoverScreen.classList.remove('hidden');
        }

        function gameLoop() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.scale((rect.width * dpr) / VIEW_W, (rect.height * dpr) / VIEW_H);

            const bgImg = assets.backgrounds[selectedVersion];
            if ((currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) && bgImg.complete && bgImg.naturalWidth > 0) {
                ctx.drawImage(bgImg, 0, 0, VIEW_W, VIEW_H);
            } else {
                let grad = ctx.createLinearGradient(0, 0, 0, VIEW_H);
                grad.addColorStop(0, '#38bdf8');
                grad.addColorStop(0.7, '#818cf8');
                grad.addColorStop(1, '#34d399');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, VIEW_W, VIEW_H);
            }

            if (currentState === STATES.PLAYING) {
                bird.velocityY += gravity;
                bird.y += bird.velocityY;

                spawnTimer++;
                const spawnInterval = Math.max(60, Math.floor(150 / pipeSpeed));
                if (spawnTimer >= spawnInterval) {
                    spawnPipe();
                    spawnTimer = 0;
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    let p = pipes[i];
                    p.x -= pipeSpeed;

                    if (!p.passed && p.x + basePipeWidth < bird.x) {
                        p.passed = true;
                        score++;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('lemsbond_high_score', highScore);
                        }
                    }

                    if (checkCollision(bird, p)) {
                        triggerGameOver();
                    }

                    if (p.x + basePipeWidth < 0) {
                        pipes.splice(i, 1);
                    }
                }
            }

            if (currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) {
                const topImg = assets.topPipes[selectedVersion];
                const botImg = assets.bottomPipes[selectedVersion];
                const groundY = VIEW_H - 36;

                pipes.forEach(p => {
                    drawStackedObstacle(topImg, p.x, 0, p.topHeight, true);
                    drawStackedObstacle(botImg, p.x, p.bottomY, groundY - p.bottomY, false);
                });

                ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
                ctx.fillRect(0, groundY, VIEW_W, VIEW_H - groundY);

                drawBird(assets.birds[selectedVersion], bird);
                drawCleanHUD();
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

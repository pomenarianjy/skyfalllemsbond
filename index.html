<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lems Bond Skyfall</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: -webkit-optimize-contrast;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
            padding: 24px 16px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            margin-top: 10px;
            font-weight: 800;
        }

        .btn {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            border: none;
            color: white;
            padding: 16px 36px;
            font-size: 1.25rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(255, 126, 95, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-bottom: 30px;
            width: 85%;
            max-width: 320px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Start Screen Image */
        .start-img {
            flex: 1;
            width: auto;
            height: auto;
            max-width: 88vw;
            max-height: 58vh;
            object-fit: contain;
            margin: auto;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.3));
        }

        /* Fullscreen Game Over Overlay */
        #gameover-screen {
            padding: 0;
            justify-content: center;
            background: #000;
        }

        .gameover-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .gameover-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 60px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.75) 100%);
        }

        .score-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .score-box h2 {
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 4px;
            font-weight: 800;
        }

        .score-box p {
            font-size: 1rem;
            color: #16a34a;
            font-weight: 700;
        }

        /* Selection Cards */
        .selection-container {
            flex: 1;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 98vw;
            max-width: 520px;
            margin: 20px 0;
        }

        .version-card {
            flex: 1;
            height: 60vh;
            max-height: 380px;
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid transparent;
            border-radius: 24px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .version-card:active {
            transform: scale(0.96);
            border-color: #22c55e;
            background: #ffffff;
        }

        .version-card img {
            width: auto;
            height: auto;
            max-width: 92%;
            max-height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));
        }

        .version-title {
            font-weight: 800;
            font-size: 1.1rem;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .version-desc {
            font-size: 0.78rem;
            color: #64748b;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h1>Lems Bond Skyfall</h1>
            <img src="birdstart.png" alt="Start Bird" class="start-img" id="img-start-screen" onerror="this.style.display='none'">
            <button class="btn" id="btn-start-proceed">Tap to Play</button>
        </div>

        <!-- Selection Screen Overlay -->
        <div id="select-screen" class="overlay hidden">
            <h1>Select Theme</h1>
            <div class="selection-container">
                <div class="version-card" onclick="selectVersion(1)">
                    <img src="bird1.png" alt="Banker" onerror="this.style.display='none'">
                    <div>
                        <div class="version-title">The Banker</div>
                        <div class="version-desc">Coins & Wealth</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(2)">
                    <img src="bird2.png" alt="Paris" onerror="this.style.display='none'">
                    <div>
                        <div class="version-title">Paris</div>
                        <div class="version-desc">Macarons & Romance</div>
                    </div>
                </div>

                <div class="version-card" onclick="selectVersion(3)">
                    <img src="bird3.png" alt="Hong Kong" onerror="this.style.display='none'">
                    <div>
                        <div class="version-title">Hong Kong</div>
                        <div class="version-desc">Dragons & Clouds</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fullscreen Game Over Screen -->
        <div id="gameover-screen" class="overlay hidden">
            <img src="birdgameover.png" alt="Game Over" class="gameover-bg" id="img-gameover-screen" onerror="this.style.display='none'">
            <div class="gameover-content">
                <div class="score-box">
                    <h2 id="txt-final-score">Score: 0</h2>
                    <p>Tap anywhere to restart</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const getLogicalWidth = () => window.innerWidth;
        const getLogicalHeight = () => window.innerHeight;

        // Assets Loader
        const assets = {
            birds: [new Image(), new Image(), new Image()],
            backgrounds: [new Image(), new Image(), new Image()],
            bottomPipes: [new Image(), new Image(), new Image()],
            topPipes: [new Image(), new Image(), new Image()],
            birdMasks: [null, null, null]
        };

        // Generates binary alpha mask array (1 for colored pixel, 0 for transparent)
        function generateAlphaMask(img) {
            const tempCanvas = document.createElement('canvas');
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            tempCanvas.width = w;
            tempCanvas.height = h;

            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
            tempCtx.drawImage(img, 0, 0);

            try {
                const imgData = tempCtx.getImageData(0, 0, w, h).data;
                const mask = new Uint8Array(w * h);

                for (let i = 0; i < w * h; i++) {
                    // Alpha channel > 30 represents visible colored pixel
                    mask[i] = imgData[i * 4 + 3] > 30 ? 1 : 0;
                }
                return { mask, width: w, height: h };
            } catch (e) {
                console.warn('Could not extract pixel alpha mask', e);
                return null;
            }
        }

        function loadBirdAsset(index, src) {
            assets.birds[index].onload = () => {
                assets.birdMasks[index] = generateAlphaMask(assets.birds[index]);
            };
            assets.birds[index].src = src;
        }

        loadBirdAsset(0, 'bird1.png');
        loadBirdAsset(1, 'bird2.png');
        loadBirdAsset(2, 'bird3.png');

        assets.backgrounds[0].src = 'background1.png';
        assets.backgrounds[1].src = 'background2.png';
        assets.backgrounds[2].src = 'background3.png';

        assets.bottomPipes[0].src = 'coin.png';
        assets.topPipes[0].src = 'coin.png';

        assets.bottomPipes[1].src = 'macaron.png';
        assets.topPipes[1].src = 'macaron.png';

        assets.bottomPipes[2].src = 'dragon.png';
        assets.topPipes[2].src = 'cloud.png';

        // State Variables
        const STATES = { START: 0, SELECT: 1, PLAYING: 2, GAMEOVER: 3 };
        let currentState = STATES.START;
        let selectedVersion = 0;

        let score = 0;
        let highScore = parseInt(localStorage.getItem('lemsbond_high_score')) || 0;

        // Physics
        const gravity = 0.32;
        const jumpStrength = -6.2;
        const basePipeWidth = 68;

        let pipeSpeed = 2.4;
        let pipeGap = 145;

        const bird = {
            x: 70,
            y: 300,
            targetWidth: 50,
            width: 50,
            height: 50,
            velocityY: 0,
            rotation: 0
        };

        let pipes = [];
        let spawnTimer = 0;

        // UI Handles
        const startScreen = document.getElementById('start-screen');
        const selectScreen = document.getElementById('select-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const btnStartProceed = document.getElementById('btn-start-proceed');
        const txtFinalScore = document.getElementById('txt-final-score');

        btnStartProceed.addEventListener('click', (e) => {
            e.stopPropagation();
            startScreen.classList.add('hidden');
            selectScreen.classList.remove('hidden');
            currentState = STATES.SELECT;
        });

        function selectVersion(v) {
            selectedVersion = v - 1;
            selectScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            resetGame();
            currentState = STATES.PLAYING;
        }

        function resetGame() {
            bird.y = getLogicalHeight() * 0.4;
            bird.velocityY = 0;
            bird.rotation = 0;
            pipes = [];
            score = 0;
            pipeSpeed = 2.4;
            pipeGap = 145;
            spawnTimer = 0;
        }

        function handleInput() {
            if (currentState === STATES.PLAYING) {
                bird.velocityY = jumpStrength;
            } else if (currentState === STATES.GAMEOVER) {
                gameoverScreen.classList.add('hidden');
                selectScreen.classList.remove('hidden');
                currentState = STATES.SELECT;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') handleInput();
        });

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        }, { passive: false });

        gameoverScreen.addEventListener('click', handleInput);

        function spawnPipe() {
            const logicalH = getLogicalHeight();
            const groundY = logicalH - 40;

            const levelMultiplier = Math.floor(score / 10);
            pipeSpeed = 2.4 + (levelMultiplier * 0.35);
            pipeGap = Math.max(115, 145 - (levelMultiplier * 4));

            const minHeight = 70;
            const maxHeight = groundY - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: getLogicalWidth(),
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }

        // True Pixel-Perfect Alpha Collision
        function checkCollision(b, pipe) {
            const maskData = assets.birdMasks[selectedVersion];
            const logicalH = getLogicalHeight();
            const groundY = logicalH - 40;

            const pipeLeft = pipe.x;
            const pipeRight = pipe.x + basePipeWidth;
            const topPipeBottom = pipe.topHeight;
            const bottomPipeTop = pipe.bottomY;

            // Fallback rectangular check if mask fails
            if (!maskData) {
                if (b.y <= 0 || (b.y + b.height) >= groundY) return true;
                if ((b.x + b.width) > pipeLeft && b.x < pipeRight) {
                    if (b.y < topPipeBottom || (b.y + b.height) > bottomPipeTop) return true;
                }
                return false;
            }

            const { mask, width: imgW, height: imgH } = maskData;
            const cx = b.x + b.width / 2;
            const cy = b.y + b.height / 2;
            const cos = Math.cos(b.rotation);
            const sin = Math.sin(b.rotation);

            // Sub-sampled resolution step for ultra-fast 60fps performance
            const step = Math.max(1, Math.floor(imgW / 24));

            for (let py = 0; py < imgH; py += step) {
                for (let px = 0; px < imgW; px += step) {
                    if (mask[py * imgW + px] === 1) { // Colored visible pixel
                        const nx = (px / imgW) - 0.5;
                        const ny = (py / imgH) - 0.5;

                        const localX = nx * b.width;
                        const localY = ny * b.height;

                        // Rotated local coordinates translated to world space
                        const wx = cx + (localX * cos - localY * sin);
                        const wy = cy + (localX * sin + localY * cos);

                        // Ceiling / Ground collision
                        if (wy <= 0 || wy >= groundY) {
                            return true;
                        }

                        // Obstacle collision
                        if (wx >= pipeLeft && wx <= pipeRight) {
                            if (wy <= topPipeBottom || wy >= bottomPipeTop) {
                                return true;
                            }
                        }
                    }
                }
            }
            return false;
        }

        function drawStackedObstacle(img, x, startY, totalHeight, isTopPipe) {
            if (!img.complete || img.naturalWidth === 0) {
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(x, startY, basePipeWidth, totalHeight);
                return;
            }

            const aspect = img.naturalHeight / img.naturalWidth;
            const itemWidth = basePipeWidth;
            const itemHeight = itemWidth * aspect;
            const count = Math.max(1, Math.ceil(totalHeight / itemHeight));

            ctx.save();
            ctx.beginPath();
            ctx.rect(x, startY, basePipeWidth, totalHeight);
            ctx.clip();

            if (isTopPipe) {
                for (let i = 0; i < count; i++) {
                    const itemY = (startY + totalHeight) - ((i + 1) * itemHeight);
                    ctx.drawImage(img, x, itemY, itemWidth, itemHeight);
                }
            } else {
                for (let i = 0; i < count; i++) {
                    const itemY = startY + (i * itemHeight);
                    ctx.drawImage(img, x, itemY, itemWidth, itemHeight);
                }
            }
            ctx.restore();
        }

        function drawBird(img, b) {
            const aspect = (img.complete && img.naturalWidth > 0) ? (img.naturalHeight / img.naturalWidth) : 1;
            b.width = b.targetWidth;
            b.height = b.targetWidth * aspect;

            ctx.save();
            ctx.translate(b.x + b.width / 2, b.y + b.height / 2);

            b.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, b.velocityY * 0.08));
            ctx.rotate(b.rotation);

            if (img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, -b.width / 2, -b.height / 2, b.width, b.height);
            } else {
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(0, 0, b.width / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawCleanHUD(w, h) {
            const pillW = 120;
            const pillH = 54;
            const pillX = w - pillW - 16;
            const pillY = 16;

            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
            ctx.beginPath();
            ctx.roundRect(pillX, pillY, pillW, pillH, 16);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`BEST ${highScore}`, pillX + pillW - 14, pillY + 20);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`${score}`, pillX + pillW - 14, pillY + 44);
            ctx.restore();
        }

        function triggerGameOver() {
            currentState = STATES.GAMEOVER;
            txtFinalScore.innerText = `Score: ${score}`;
            gameoverScreen.classList.remove('hidden');
        }

        function gameLoop() {
            const w = getLogicalWidth();
            const h = getLogicalHeight();
            const groundY = h - 40;

            ctx.clearRect(0, 0, w, h);

            // Render Environment Background
            const bgImg = assets.backgrounds[selectedVersion];
            if ((currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) && bgImg.complete && bgImg.naturalWidth > 0) {
                ctx.drawImage(bgImg, 0, 0, w, h);
            } else {
                let grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#38bdf8');
                grad.addColorStop(0.7, '#818cf8');
                grad.addColorStop(1, '#34d399');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
            }

            // Logic Processing
            if (currentState === STATES.PLAYING) {
                bird.velocityY += gravity;
                bird.y += bird.velocityY;

                spawnTimer++;
                const spawnInterval = Math.max(60, Math.floor(150 / pipeSpeed));
                if (spawnTimer >= spawnInterval) {
                    spawnPipe();
                    spawnTimer = 0;
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    let p = pipes[i];
                    p.x -= pipeSpeed;

                    if (!p.passed && p.x + basePipeWidth < bird.x) {
                        p.passed = true;
                        score++;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('lemsbond_high_score', highScore);
                        }
                    }

                    if (checkCollision(bird, p)) {
                        triggerGameOver();
                    }

                    if (p.x + basePipeWidth < 0) {
                        pipes.splice(i, 1);
                    }
                }
            }

            // Render Obstacles & Bird
            if (currentState === STATES.PLAYING || currentState === STATES.GAMEOVER) {
                const topImg = assets.topPipes[selectedVersion];
                const botImg = assets.bottomPipes[selectedVersion];

                pipes.forEach(p => {
                    drawStackedObstacle(topImg, p.x, 0, p.topHeight, true);
                    drawStackedObstacle(botImg, p.x, p.bottomY, groundY - p.bottomY, false);
                });

                ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
                ctx.fillRect(0, groundY, w, h - groundY);

                drawBird(assets.birds[selectedVersion], bird);
                drawCleanHUD(w, h);
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

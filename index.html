<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lems Bond Skyfall</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #060911;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Mobile Portrait Orientation Prompt Overlay */
        #rotate-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(6, 9, 17, 0.96);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            padding: 24px;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }
        #rotate-overlay.dismissed {
            display: none !important;
        }
        .rotate-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
            animation: rotateDevice 2s infinite ease-in-out;
        }
        @keyframes rotateDevice {
            0%, 15% { transform: rotate(0deg); }
            50%, 65% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }
        #rotate-overlay h2 {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            margin-bottom: 8px;
            font-weight: 800;
        }
        #rotate-overlay p {
            font-size: clamp(0.85rem, 2.5vw, 1.1rem);
            color: #94a3b8;
            max-width: 320px;
            line-height: 1.4;
        }
        .dismiss-text {
            margin-top: 18px;
            font-size: 0.85rem;
            color: #feb47b;
            text-decoration: underline;
            font-weight: 600;
        }
        @media (orientation: portrait) {
            #rotate-overlay:not(.dismissed) {
                display: flex;
            }
        }
        /* Horizontal Widescreen Game Viewport (16:9 Ratio) */
        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-width: 177.78vh;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        /* Top Overlay Canvas for Front-Layer Flying Bird */
        #topCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        /* Overlays Base Style */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 16px 14px;
            text-align: center;
        }
        /* Start Screen Background */
        #start-screen {
            background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.65)), url('background1.png') center/cover no-repeat;
        }
        /* Translucent Selection Screen */
        #select-screen {
            background: linear-gradient(rgba(15, 23, 42, 0.35), rgba(15, 23, 42, 0.55));
            backdrop-filter: blur(2px);
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: clamp(1.4rem, 4.5vw, 2.4rem);
            color: #ffffff;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255,255,255,0.3);
            margin-top: 2px;
            font-weight: 800;
            position: relative;
            z-index: 2;
        }
        .btn {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            border: none;
            color: white;
            padding: 12px 36px;
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            font-weight: 800;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 126, 95, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-bottom: 6px;
            position: relative;
            z-index: 2;
        }
        .btn:active {
            transform: scale(0.95);
        }
        /* Start Screen Image */
        .start-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 92%;
            width: auto;
            max-width: 95%;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.7));
        }
        /* High Score Badge */
        .top-right-score-badge {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            padding: 6px 14px;
            border-radius: 9999px;
            color: #ffffff;
            font-size: clamp(0.75rem, 1.8vw, 1rem);
            font-weight: 800;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            z-index: 10;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-right-score-badge span {
            color: #22c55e;
            font-size: clamp(0.85rem, 2.2vw, 1.25rem);
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }
        /* Selection Cards Optimized for Mobile & Widescreen */
        .selection-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: clamp(8px, 2vw, 24px);
            width: 96%;
            max-width: 880px;
            margin: auto 0;
            position: relative;
            z-index: 2;
        }
        .version-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: clamp(8px, 2vh, 18px) clamp(6px, 1.5vw, 12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(4px, 1vh, 10px);
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.6);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s ease, box-shadow 0.2s ease;
        }
        .version-card:hover {
            transform: translateY(-4px) scale(1.02);
            background: #ffffff;
            box-shadow: 0 18px 36px rgba(0,0,0,0.6), 0 0 18px rgba(255,255,255,0.8);
        }
        .version-card:active {
            transform: scale(0.96);
        }
        .version-card img {
            width: clamp(42px, 12vw, 110px);
            height: clamp(42px, 12vw, 110px);
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.25));
            transition: transform 0.2s ease;
        }
        .version-card:hover img {
            transform: scale(1.06);
        }
        .card-text-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
        }
        .version-title {
            font-weight: 800;
            font-size: clamp(0.75rem, 2vw, 1.15rem);
            color: #0f172a;
            letter-spacing: -0.3px;
            text-align: center;
            white-space: nowrap;
        }
        .version-desc {
            font-size: clamp(0.6rem, 1.4vw, 0.8rem);
            color: #475569;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
        }
        @media (max-width: 600px) or (max-height: 480px) {
            .overlay {
                padding: 10px 8px;
            }
            .selection-container {
                gap: 6px;
                width: 98%;
            }
            .version-card {
                padding: 6px 4px;
                border-radius: 12px;
                border-width: 1.5px;
            }
            .top-right-score-badge {
                top: 8px;
                right: 10px;
                padding: 4px 10px;
            }
        }
        /* Game Over Overlay */
        #gameover-screen {
            padding: 0;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
        }
        .gameover-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 92%;
            width: auto;
            max-width: 95%;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.8));
        }
        .gameover-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 28px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.8) 100%);
        }
        .score-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 16px 36px;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .score-box:active {
            transform: scale(0.96);
        }
        .score-box h2 {
            font-size: clamp(1.4rem, 3.5vw, 2rem);
            color: #0f172a;
            margin-bottom: 2px;
            font-weight: 800;
        }
        .score-box p {
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #16a34a;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <!-- Orientation Prompt Overlay for Mobile Portrait Mode -->
    <div id="rotate-overlay" onclick="dismissRotateOverlay()">
        <div class="rotate-icon">📱</div>
        <h2>Please Rotate Your Device</h2>
        <p>This game is best experienced horizontally in landscape mode.</p>
        <div class="dismiss-text">Tap anywhere to play anyway</div>
    </div>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>Lems Bond Skyfall</h1>
            <img src="birdstart.png" alt="Start Bird" class="start-img" id="img-start-screen" onerror="this.style.display='none'">
            <button class="btn" id="btn-start-proceed">Tap to Play</button>
        </div>
        <!-- Theme Selection Screen -->
        <div id="select-screen" class="overlay hidden">
            <div class="top-right-score-badge">BEST: <span id="txt-select-best">0</span></div>
            <h1>Select Theme</h1>
            <div class="selection-container">
                <div class="version-card" onclick="selectVersion(0)">
                    <img src="bird1.png" alt="Banker" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">The Banker</div>
                        <div class="version-desc">Coins & Wealth</div>
                    </div>
                </div>
                <div class="version-card" onclick="selectVersion(1)">
                    <img src="bird2.png" alt="Paris" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">Paris</div>
                        <div class="version-desc">Macarons & Romance</div>
                    </div>
                </div>
                <div class="version-card" onclick="selectVersion(2)">
                    <img src="bird3.png" alt="Hong Kong" onerror="this.style.display='none'">
                    <div class="card-text-group">
                        <div class="version-title">Hong Kong</div>
                        <div class="version-desc">Dragons & Clouds</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Game Over Screen -->
        <div id="gameover-screen" class="overlay hidden">
            <img src="birdgameover.png" alt="Game Over" class="gameover-bg" id="img-gameover-screen" onerror="this.style.display='none'">
            <div class="gameover-content">
                <div class="score-box">
                    <h2 id="txt-final-score">Score: 0</h2>
                    <p>Tap anywhere to restart</p>
                </div>
            </div>
        </div>
        <!-- Top Canvas Layer -->
        <canvas id="topCanvas"></canvas>
    </div>
    <script>
        const container = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const topCanvas = document.getElementById('topCanvas');
        const topCtx = topCanvas.getContext('2d');
        // Horizontal Logical Stage
        const VIEW_W = 800;
        const VIEW_H = 450;
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            topCanvas.width = rect.width * dpr;
            topCanvas.height = rect.height * dpr;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function dismissRotateOverlay() {
            document.getElementById('rotate-overlay').classList.add('dismissed');
        }

        // --- WEB AUDIO API SYNTHESIZER & UNLOCKER ---
        let audioCtx = null;
        function unlockAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        ['pointerdown', 'touchstart', 'keydown'].forEach(evt => {
            window.addEventListener(evt, unlockAudio, { once: true });
        });
        function playFlapSound() {
            unlockAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(360, now);
            osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        }
        function playScoreSound() {
            unlockAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1046.5, now);
            gain1.gain.setValueAtTime(0.2, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1567.98, now + 0.07);
            gain2.gain.setValueAtTime(0.25, now + 0.07);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.07);
            osc2.stop(now + 0.25);
        }
        function playHitSound() {
            unlockAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.18);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.18);
        }
        function playClickSound() {
            unlockAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(1100, now + 0.05);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.05);
        }
        // High Score Memory
        function loadSavedHighScore() {
            try {
                const ls = localStorage.getItem('lemsbond_high_score');
                if (ls !== null) return parseInt(ls, 10) || 0;
            } catch (e) {}
            try {
                const match = document.cookie.match(/(?:^|; )lemsbond_high_score=([^;]*)/);
                if (match) return parseInt(match[1], 10) || 0;
            } catch (e) {}
            return 0;
        }
        function saveHighScore(val) {
            try {
                localStorage.setItem('lemsbond_high_score', val.toString());
            } catch (e) {}
            try {
                const d = new Date();
                d.setTime(d.getTime() + (365 * 24 * 60 * 60 * 1000));
                document.cookie = `lemsbond_high_score=${val};expires=${d.toUTCString()};path=/;SameSite=Lax`;
            } catch (e) {}
        }
        let highScore = loadSavedHighScore();
        function updateHighScoreUI() {
            const selectBestEl = document.getElementById('txt-select-best');
            if (selectBestEl) selectBestEl.innerText = highScore;
        }
        updateHighScoreUI();
        // Assets Loader
        const assets = {
            birds: [new Image(), new Image(), new Image()],
            backgrounds: [new Image(), new Image(), new Image()],
            bottomPipes: [new Image(), new Image(), new Image()],
            topPipes: [new Image(), new Image(), new Image()],
            birdMasks: [null, null, null],
            pipeBounds: {
                top: [null, null, null],
                bottom: [null, null, null]
            },
            girls: [new Image(), new Image(), new Image()]
        };
        function generateAlphaMask(img) {
            const tempCanvas = document.createElement('canvas');
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
            tempCtx.drawImage(img, 0, 0);
            try {
                const imgData = tempCtx.getImageData(0, 0, w, h).data;
                const mask = new Uint8Array(w * h);
                for (let i = 0; i < w * h; i++) {
                    mask[i] = imgData[i * 4 + 3] > 50 ? 1 : 0;
                }
                return { mask, width: w, height: h };
            } catch (e) {
                return null;
            }
        }
        function loadBirdAsset(index, src) {
            assets.birds[index].onload = () => {
                assets.birdMasks[index] = generateAlphaMask(assets.birds[index]);
                if (selectedVersion === index) updateBirdBounds();
            };
            assets.birds[index].src = src;
        }
        loadBirdAsset(0, 'bird1.png');
        loadBirdAsset(1, 'bird2.png');
        loadBirdAsset(2, 'bird3.png');
        assets.backgrounds[0].src = 'background1.png';
        assets.backgrounds[1].src = 'background2.png';
        assets.backgrounds[2].src = 'background3.png';
        assets.bottomPipes[0].src = 'coin.png';
        assets.topPipes[0].src = 'coin.png';
        assets.bottomPipes[1].src = 'macaron.png';
        assets.topPipes[1].src = 'macaron.png';
        assets.bottomPipes[2].src = 'dragon.png';
        assets.topPipes[2].src = 'cloud.png';
        assets.girls[0].src = 'girl1.png';
        assets.girls[1].src = 'girl2.png';
        assets.girls[2].src = 'girl3.png';
        // Game State
        const STATES = { START: 0, SELECT: 1, PLAYING: 2, GAMEOVER: 3 };
        let currentState = STATES.START;
        let selectedVersion = 0;
        let score = 0;
        // Tuned Physics
        const gravity = 0.26;
        const jumpStrength = -5.6;
        const basePipeWidth = 72;
        let pipeSpeed = 2.2;
        let pipeGap = 175;
        // Player Bird Physics Object
        const bird = {
            x: 120,
            y: 180,
            width: 88,
            height: 88,
            velocityY: 0,
            rotation: 0
        };
        // Flying bird1.png on menus
        const menuBird = {
            x: -120,
            y: 140,
            vx: 3.2,
            vy: 1.4,
            angle: 0
        };
        // Particles & Girl Effects State
        let particles = [];
        let topParticles = [];
        let girlSparkles = [];
        let orbitAngle = 0;
        let girlAnimTime = 0;
        function spawnSteamParticle(customBird = null) {
            const b = customBird || bird;
            const angle = b.rotation || 0;
            const offsetX = -b.width * 0.22;
            const offsetY = b.height * 0.32;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const px = (b.x + b.width / 2) + (offsetX * cos - offsetY * sin);
            const py = (b.y + b.height / 2) + (offsetX * sin + offsetY * cos);
            particles.push({
                type: 'steam',
                x: px,
                y: py,
                vx: -1.5 - Math.random() * 1.5,
                vy: 2.8 + Math.random() * 2.2,
                size: 6 + Math.random() * 5,
                alpha: 0.95,
                life: 22,
                maxLife: 22
            });
        }
        function spawnCandyParticle() {
            const candies = ['🍬', '🍭', '🍫', '🍩', '🧁'];
            const emoji = candies[Math.floor(Math.random() * candies.length)];
            const angle = bird.rotation;
            const offsetX = -bird.width * 0.15;
            const offsetY = bird.height * 0.35;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const px = (bird.x + bird.width / 2) + (offsetX * cos - offsetY * sin);
            const py = (bird.y + bird.height / 2) + (offsetX * sin + offsetY * cos);
            particles.push({
                type: 'candy',
                emoji: emoji,
                x: px,
                y: py,
                vx: (Math.random() - 0.5) * 1.6 - 0.8,
                vy: 2.2 + Math.random() * 2.5,
                size: 18 + Math.random() * 6,
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.18,
                alpha: 1.0,
                life: 32,
                maxLife: 32
            });
        }
        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.alpha = Math.max(0, p.life / p.maxLife);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.save();
                if (p.type === 'steam') {
                    p.size += 0.45;
                    ctx.fillStyle = `rgba(240, 248, 255, ${p.alpha * 0.88})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'candy') {
                    p.rot += p.vRot;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.globalAlpha = p.alpha;
                    ctx.font = `${p.size}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.emoji, 0, 0);
                }
                ctx.restore();
            }
        }
        function drawCirclingDragons() {
            orbitAngle += 0.07;
            const cx = bird.x + bird.width / 2;
            const cy = bird.y + bird.height / 2;
            const rx = 56;
            const ry = 32;
            for (let i = 0; i < 2; i++) {
                const angle = orbitAngle + i * Math.PI;
                const dx = cx + Math.cos(angle) * rx;
                const dy = cy + Math.sin(angle) * ry;
                ctx.save();
                ctx.translate(dx, dy);
                ctx.font = '24px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🐉', 0, 0);
                ctx.restore();
            }
        }
        function updateBirdBounds() {
            const img = assets.birds[selectedVersion];
            if (img && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0) {
                const maxDim = 88;
                if (img.naturalWidth >= img.naturalHeight) {
                    bird.width = maxDim;
                    bird.height = maxDim * (img.naturalHeight / img.naturalWidth);
                } else {
                    bird.height = maxDim;
                    bird.width = maxDim * (img.naturalWidth / img.naturalHeight);
                }
            }
        }
        // Optimized Girls Rendering Function
        function drawGirlAndEffects() {
            girlAnimTime += 0.05;
            const currentGirlImg = assets.girls[selectedVersion];
            
            const girlTargetH = 210; 
            let girlW = 150;
            let girlH = girlTargetH;
            if (currentGirlImg && currentGirlImg.complete && currentGirlImg.naturalHeight > 0) {
                girlW = girlTargetH * (currentGirlImg.naturalWidth / currentGirlImg.naturalHeight);
            }
            const baseGirlX = VIEW_W - girlW - 15;
            const floatOffset = Math.sin(girlAnimTime * 1.5) * 10;
            const girlX = baseGirlX;
            const girlY = VIEW_H - girlH - 10 + floatOffset;
            const girlCenterX = girlX + girlW / 2;
            const girlCenterY = girlY + girlH / 2;

            if (selectedVersion === 0) {
                ctx.save();
                const totalPetals = 8;
                for (let i = 0; i < totalPetals; i++) {
                    const angle = girlAnimTime * 1.2 + (i * Math.PI * 2 / totalPetals);
                    const rx = girlW * 0.55;
                    const ry = girlH * 0.28;
                    const px = girlCenterX + Math.cos(angle) * rx;
                    const py = girlCenterY + Math.sin(angle) * ry * 0.7;
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(angle + Math.PI / 4);
                    ctx.fillStyle = i % 2 === 0 ? '#ffb6c1' : '#ffffff';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 9, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                ctx.restore();
                if (currentGirlImg && currentGirlImg.complete && currentGirlImg.naturalWidth > 0) {
                    ctx.drawImage(currentGirlImg, girlX, girlY, girlW, girlH);
                }
            } else if (selectedVersion === 1) {
                if (currentGirlImg && currentGirlImg.complete && currentGirlImg.naturalWidth > 0) {
                    ctx.drawImage(currentGirlImg, girlX, girlY, girlW, girlH);
                }
                const wandX = girlX + girlW * 0.15;
                const wandY = girlY + girlH * 0.28;

                if (Math.random() < 0.2) {
                    const burstX = wandX + (Math.random() - 0.5) * 40;
                    const burstY = wandY + (Math.random() - 0.5) * 40;
                    const numSparks = 8;
                    for (let k = 0; k < numSparks; k++) {
                        const angle = (k / numSparks) * Math.PI * 2 + Math.random() * 0.2;
                        const speed = 1.6 + Math.random() * 2.5;
                        girlSparkles.push({
                            x: burstX,
                            y: burstY,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            size: 1.2 + Math.random() * 1.5,
                            color: Math.random() < 0.6 ? '#ff69b4' : (Math.random() < 0.5 ? '#ff1493' : '#ffffff'),
                            life: 20 + Math.floor(Math.random() * 12),
                            maxLife: 32
                        });
                    }
                }

                if (girlSparkles.length > 0) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.lineCap = 'round';

                    for (let s = girlSparkles.length - 1; s >= 0; s--) {
                        let sp = girlSparkles[s];
                        sp.x += sp.vx;
                        sp.y += sp.vy;
                        sp.vx *= 0.95;
                        sp.vy *= 0.95;
                        sp.vy += 0.05;
                        sp.life--;

                        if (sp.life <= 0) {
                            girlSparkles.splice(s, 1);
                            continue;
                        }

                        const alpha = Math.max(0, sp.life / sp.maxLife);
                        ctx.globalAlpha = alpha;

                        ctx.strokeStyle = sp.color;
                        ctx.lineWidth = sp.size;
                        ctx.beginPath();
                        ctx.moveTo(sp.x - sp.vx * 2, sp.y - sp.vy * 2);
                        ctx.lineTo(sp.x, sp.y);
                        ctx.stroke();

                        ctx.fillStyle = sp.color;
                        ctx.beginPath();
                        ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            } else if (selectedVersion === 2) {
                if (currentGirlImg && currentGirlImg.complete && currentGirlImg.naturalWidth > 0) {
                    ctx.drawImage(currentGirlImg, girlX, girlY, girlW, girlH);
                }
                const headX = girlCenterX;
                const headY = girlY - 15;
                ctx.save();
                ctx.font = '24px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let h = 0; h < 3; h++) {
                    const angle = girlAnimTime * 1.5 + (h * Math.PI * 2 / 3);
                    const hx = headX + Math.cos(angle) * 38;
                    const hy = headY + Math.sin(angle) * 14;
                    ctx.fillText('❤️', hx, hy);
                }
                ctx.restore();
            }
        }
        // Draw Pipes preserving original aspect ratio
        function drawAlignedPipe(img, boundsInfo, x, targetY, width, totalHeight, isTopPipe) {
            if (!img || !img.complete || img.naturalWidth === 0 || totalHeight <= 0) return;
            
            const tileH = width * (img.naturalHeight / img.naturalWidth);
            if (tileH <= 0) return;
            ctx.save();
            if (isTopPipe) {
                ctx.beginPath();
                ctx.rect(x, 0, width, targetY);
                ctx.clip();
                let currY = targetY - tileH;
                while (currY + tileH > 0) {
                    ctx.drawImage(img, x, currY, width, tileH);
                    currY -= tileH;
                }
            } else {
                ctx.beginPath();
                ctx.rect(x, targetY, width, VIEW_H - targetY);
                ctx.clip();
                let currY = targetY;
                while (currY < VIEW_H) {
                    ctx.drawImage(img, x, currY, width, tileH);
                    currY += tileH;
                }
            }
            ctx.restore();
        }
        // Pipes Logic
        let pipes = [];
        function spawnPipes() {
            const minHeight = 50;
            const maxHeight = VIEW_H - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
            pipes.push({
                x: VIEW_W,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }
        function resetGame() {
            bird.y = 180;
            bird.velocityY = 0;
            bird.rotation = 0;
            score = 0;
            pipes = [];
            particles = [];
            girlSparkles = [];
            pipeSpeed = 2.2;
            pipeGap = 175;
            spawnPipes();
        }
        function selectVersion(v) {
            playClickSound();
            selectedVersion = v;
            updateBirdBounds();
            document.getElementById('select-screen').classList.add('hidden');
            resetGame();
            currentState = STATES.PLAYING;
        }
        function handleJump() {
            if (currentState === STATES.PLAYING) {
                bird.velocityY = jumpStrength;
                playFlapSound();
            }
        }
        // Inputs
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (currentState === STATES.PLAYING) handleJump();
                e.preventDefault();
            }
        });
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button') || e.target.closest('.version-card') || e.target.closest('#rotate-overlay')) return;
            if (currentState === STATES.START) {
                playClickSound();
                currentState = STATES.SELECT;
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('select-screen').classList.remove('hidden');
            } else if (currentState === STATES.PLAYING) {
                handleJump();
            } else if (currentState === STATES.GAMEOVER) {
                playClickSound();
                document.getElementById('gameover-screen').classList.add('hidden');
                document.getElementById('select-screen').classList.remove('hidden');
                currentState = STATES.SELECT;
            }
        });
        document.getElementById('btn-start-proceed').addEventListener('click', () => {
            playClickSound();
            currentState = STATES.SELECT;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('select-screen').classList.remove('hidden');
        });
        // Pixel-Precise Collision Detection
        function checkPixelCollision(birdX, birdY, birdW, birdH, maskData, pipeX, pipeY, pipeW, pipeH) {
            const ix0 = Math.max(birdX, pipeX);
            const iy0 = Math.max(birdY, pipeY);
            const ix1 = Math.min(birdX + birdW, pipeX + pipeW);
            const iy1 = Math.min(birdY + birdH, pipeY + pipeH);
            if (ix0 >= ix1 || iy0 >= iy1) return false;
            if (!maskData || !maskData.mask) return true;
            const scaleX = maskData.width / birdW;
            const scaleY = maskData.height / birdH;
            for (let y = iy0; y < iy1; y++) {
                for (let x = ix0; x < ix1; x++) {
                    const bx = Math.floor((x - birdX) * scaleX);
                    const by = Math.floor((y - birdY) * scaleY);
                    if (bx >= 0 && bx < maskData.width && by >= 0 && by < maskData.height) {
                        if (maskData.mask[by * maskData.width + bx] === 1) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }
        function checkCollision(p) {
            const birdMask = assets.birdMasks[selectedVersion];
            const topHit = checkPixelCollision(bird.x, bird.y, bird.width, bird.height, birdMask, p.x, 0, basePipeWidth, p.topHeight);
            if (topHit) return true;
            const bottomHit = checkPixelCollision(bird.x, bird.y, bird.width, bird.height, birdMask, p.x, p.bottomY, basePipeWidth, VIEW_H - p.bottomY);
            if (bottomHit) return true;
            return false;
        }
        // Front Layer Top Canvas Drawing Function
        function updateAndDrawTopLayer(scale) {
            topCtx.clearRect(0, 0, topCanvas.width, topCanvas.height);
            if (currentState === STATES.SELECT || currentState === STATES.GAMEOVER || currentState === STATES.START) {
                topCtx.save();
                topCtx.scale(scale, scale);
                menuBird.x += menuBird.vx;
                menuBird.y += Math.sin(menuBird.angle) * menuBird.vy;
                menuBird.angle += 0.04;
                if (menuBird.x > VIEW_W + 150) {
                    menuBird.x = -160;
                    menuBird.y = 50 + Math.random() * (VIEW_H - 180);
                }
                if (Math.random() < 0.5) {
                    const mImg = assets.birds[0];
                    let mbH = 135;
                    let mbW = (mImg && mImg.complete && mImg.naturalHeight > 0) ? mbH * (mImg.naturalWidth / mImg.naturalHeight) : mbH;
                    topParticles.push({
                        x: menuBird.x + mbW * 0.15,
                        y: menuBird.y + mbH * 0.65,
                        vx: -1.8 - Math.random() * 1.5,
                        vy: 2.0 + Math.random() * 2.0,
                        size: 7 + Math.random() * 6,
                        alpha: 0.9,
                        life: 25,
                        maxLife: 25
                    });
                }
                for (let i = topParticles.length - 1; i >= 0; i--) {
                    let tp = topParticles[i];
                    tp.x += tp.vx;
                    tp.y += tp.vy;
                    tp.life--;
                    tp.alpha = Math.max(0, tp.life / tp.maxLife);
                    if (tp.life <= 0) {
                        topParticles.splice(i, 1);
                        continue;
                    }
                    topCtx.fillStyle = `rgba(240, 248, 255, ${tp.alpha})`;
                    topCtx.beginPath();
                    topCtx.arc(tp.x, tp.y, tp.size, 0, Math.PI * 2);
                    topCtx.fill();
                }
                const mImg = assets.birds[0];
                if (mImg && mImg.complete && mImg.naturalWidth > 0) {
                    let mbH = 135;
                    let mbW = mbH * (mImg.naturalWidth / mImg.naturalHeight);
                    
                    topCtx.save();
                    topCtx.drawImage(mImg, menuBird.x, menuBird.y, mbW, mbH);
                    topCtx.restore();
                }
                topCtx.restore();
            }
        }
        // Main Game Loop
        function gameLoop(now) {
            requestAnimationFrame(gameLoop);
            ctx.save();
            const scale = canvas.width / VIEW_W;
            ctx.scale(scale, scale);
            // Draw Background
            const bgImg = assets.backgrounds[selectedVersion];
            if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
                ctx.drawImage(bgImg, 0, 0, VIEW_W, VIEW_H);
            } else {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, VIEW_W, VIEW_H);
            }
            if (currentState === STATES.PLAYING) {
                bird.velocityY += gravity;
                bird.y += bird.velocityY;
                bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.velocityY * 0.08));
                if (selectedVersion === 0) {
                    if (Math.random() < 0.6) spawnSteamParticle();
                } else if (selectedVersion === 1) {
                    if (Math.random() < 0.5) spawnCandyParticle();
                }
                updateAndDrawParticles();
                // Floor / Ceiling Collision
                if (bird.y + bird.height >= VIEW_H || bird.y <= 0) {
                    playHitSound();
                    currentState = STATES.GAMEOVER;
                    document.getElementById('txt-final-score').innerText = `Score: ${score}`;
                    document.getElementById('gameover-screen').classList.remove('hidden');
                }
                // Update & Render Pipes
                for (let i = pipes.length - 1; i >= 0; i--) {
                    let p = pipes[i];
                    p.x -= pipeSpeed;
                    const topImg = assets.topPipes[selectedVersion];
                    const topBounds = assets.pipeBounds.top[selectedVersion];
                    drawAlignedPipe(topImg, topBounds, p.x, p.topHeight, basePipeWidth, p.topHeight, true);
                    const bottomImg = assets.bottomPipes[selectedVersion];
                    const bottomBounds = assets.pipeBounds.bottom[selectedVersion];
                    drawAlignedPipe(bottomImg, bottomBounds, p.x, p.bottomY, basePipeWidth, VIEW_H - p.bottomY, false);
                    if (checkCollision(p)) {
                        playHitSound();
                        currentState = STATES.GAMEOVER;
                        document.getElementById('txt-final-score').innerText = `Score: ${score}`;
                        document.getElementById('gameover-screen').classList.remove('hidden');
                    }
                    if (!p.passed && p.x + basePipeWidth < bird.x) {
                        p.passed = true;
                        score++;
                        playScoreSound();
                        if (score > highScore) {
                            highScore = score;
                            saveHighScore(highScore);
                            updateHighScoreUI();
                        }
                    }
                    if (p.x + basePipeWidth < 0) {
                        pipes.splice(i, 1);
                    }
                }
                if (pipes.length === 0 || pipes[pipes.length - 1].x < VIEW_W - 260) {
                    spawnPipes();
                }
                ctx.save();
                ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
                ctx.rotate(bird.rotation);
                const bImg = assets.birds[selectedVersion];
                if (bImg && bImg.complete) {
                    ctx.drawImage(bImg, -bird.width / 2, -bird.height / 2, bird.width, bird.height);
                }
                ctx.restore();
                if (selectedVersion === 2) {
                    drawCirclingDragons();
                }
                drawGirlAndEffects();
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.font = '800 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeText(score.toString(), VIEW_W / 2, 50);
                ctx.fillText(score.toString(), VIEW_W / 2, 50);
            }
            ctx.restore();
            updateAndDrawTopLayer(scale);
        }
        requestAnimationFrame(gameLoop);
    </script>
